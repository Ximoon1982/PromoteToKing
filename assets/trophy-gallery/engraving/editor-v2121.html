<!doctype html><html><head><meta charset="utf-8"><title>P2K Trophy Engraver</title></head><body><p id="status">Loading engraver…</p><script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const source=new URL('editor.html',location.href);
  const response=await fetch(source,{cache:'no-store',credentials:'same-origin'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  let html=await response.text();
  const oldLoad=`async function loadImages() {\n  const keys = Object.keys(ASSETS);\n  await Promise.all(keys.map(key => new Promise((resolve, reject) => {\n    const im = new Image(); im.onload = () => { images[key] = im; resolve(); }; im.onerror = reject; im.src = ASSETS[key];\n  })));\n  updateVisibleControls(); loadSample();\n}`;
  const newLoad=`function currentAssetKey(){ return els.awardType.value+'_'+els.finish.value; }\nasync function ensureCurrentImage(){\n  const key=currentAssetKey(); if(images[key])return images[key];\n  if(!ASSETS[key])throw new Error('Unknown trophy artwork '+key);\n  const im=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=ASSETS[key];});\n  images[key]=im; return im;\n}\nasync function loadImages(){ await ensureCurrentImage(); updateVisibleControls(); loadSample(); }`;
  const oldChange=`[els.awardType, els.finish, els.showGuides].forEach(el => el.addEventListener('change', () => { updateVisibleControls(); if (el===els.awardType || el===els.finish) loadSample(); else render(); }));`;
  const newChange=`[els.awardType, els.finish, els.showGuides].forEach(el => el.addEventListener('change', () => { updateVisibleControls(); if (el===els.awardType || el===els.finish) ensureCurrentImage().then(loadSample).catch(err=>{els.infoLabel.textContent='Load failed';els.infoSize.textContent=String(err);console.error(err);}); else render(); }));`;
  const oldActions=`      <div class="row">\n        <button id="sampleBtn">Load sample</button>\n        <button id="clearBtn" class="secondary">Clear text</button>\n      </div>\n      <div class="row" style="margin-top:10px">\n        <button id="downloadBtn">Download PNG</button>\n        <button id="resetBtn" class="ghost">Reset sliders</button>\n      </div>`;
  const newActions=`      <div class="row">\n        <button id="clearBtn" class="secondary">Clear text</button>\n        <button id="resetBtn" class="ghost">Reset sliders</button>\n      </div>\n      <div class="row" style="margin-top:10px">\n        <button id="downloadBtn">Use in gallery</button>\n        <button id="deviceDownloadBtn" class="secondary">Download image</button>\n      </div>`;
  const oldDownload=`function downloadPNG() { els.canvas.toBlob(blob => { if(window.parent!==window){window.parent.postMessage({type:'p2k-trophy-engraving',name:\`p2k-1wl-\${els.awardType.value}-\${els.finish.value}.png\`,blob},location.origin);return;} const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=\`p2k-1wl-\${els.awardType.value}-\${els.finish.value}.png\`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);},'image/png'); }`;
  const newDownload=oldDownload+`\nfunction downloadDevicePNG() { els.canvas.toBlob(blob => { if(!blob)return; const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=\`p2k-1wl-\${els.awardType.value}-\${els.finish.value}.png\`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);},'image/png'); }`;
  const oldDefault=`function p2kDefaultTeam(){\n const team='Promote to King';\n if(els.middleText)els.middleText.value=team;\n if(els.cupPlaque)els.cupPlaque.value=team;\n if(els.crystalTop)els.crystalTop.value=team;\n}`;
  const newDefault=`function p2kDefaultTeam(){\n if(els.middleText)els.middleText.value='Promote to King';\n if(els.cupPlaque)els.cupPlaque.value='Promote\\nto King';\n if(els.crystalTop)els.crystalTop.value='Promote\\nto King';\n}`;
  const sampleStart=html.indexOf('const SAMPLE_TEXTS = '),sampleEnd=html.indexOf('\n\nconst els =',sampleStart);
  if(!html.includes(oldLoad)||!html.includes(oldChange)||!html.includes(oldActions)||!html.includes(oldDownload)||!html.includes(oldDefault)||sampleStart<0||sampleEnd<0)throw new Error('Qualified engraver source signature changed; v2.13.3 patch refused.');
  const samples={medal:{gold:{upper:'ONE WORLD\nLeague 2025',middle:'Promote to King',lower:'U1800 20+'},silver:{upper:'ONE WORLD\nLeague 2025',middle:'Promote to King',lower:'U1800 20+'},bronze:{upper:'ONE WORLD\nLeague 2025',middle:'Promote to King',lower:'U1800 20+'}},cup:{gold:{plaque:'Promote\nto King'},silver:{plaque:'Promote\nto King'},bronze:{plaque:'Promote\nto King'}},crystal:{gold:{top:'Promote\nto King',bottom:'7WL Winter\nChampions 2026'},silver:{top:'Promote\nto King',bottom:'7WL Winter\nChampions 2026'},bronze:{top:'Promote\nto King',bottom:'7WL Winter\nChampions 2026'}}};
  html=html.slice(0,sampleStart)+'const SAMPLE_TEXTS = '+JSON.stringify(samples)+';'+html.slice(sampleEnd);
  html=html.replace(oldLoad,newLoad).replace(oldChange,newChange).replace(oldActions,newActions).replace(oldDownload,newDownload).replace(oldDefault,newDefault);
  html=html.replace('<input id="crystalTopSize" type="range" min="70" max="140" step="1" value="100">','<input id="crystalTopSize" type="range" min="70" max="140" step="1" value="140">');
  html=html.replace("['crystalTopSize',100]","['crystalTopSize',140]");
  html=html.replace("els.sampleBtn.addEventListener('click', loadSample);","");
  html=html.replace("els.downloadBtn.addEventListener('click', downloadPNG);","els.downloadBtn.addEventListener('click', downloadPNG); document.getElementById('deviceDownloadBtn')?.addEventListener('click', downloadDevicePNG);");
  document.open(); document.write(html); document.close();
 }catch(error){status.textContent='Engraver unavailable: '+error.message;console.error(error);}
})();
</script></body></html>
