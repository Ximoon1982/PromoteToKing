<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const integer=new Intl.NumberFormat('en-GB'),pointsFormat=new Intl.NumberFormat('en-GB',{minimumFractionDigits:0,maximumFractionDigits:1});
const PAGE_SIZE=12,embedded=new URLSearchParams(location.search).get('embedded')==='1'&&parent!==window;
let rows=[],page=1,totalPages=1,medalMap=new Map(),catalog=[],profiles={},view='highlights';const requestCache=new Map();
function resize(){try{parent.postMessage({type:'p2k-frame-height',height:document.documentElement.scrollHeight+8},location.origin)}catch(_){} }
function dateText(value){if(!value)return'Date pending tournament refresh';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('en-GB',{ timeZone: "UTC",dateStyle:'medium'}).format(d)}
async function json(url,ttl=60000,force=false){const resolved=new URL(url,location.href).href,now=Date.now(),cached=requestCache.get(resolved);if(!force&&cached&&cached.expires>now)return cached.payload;const response=await fetch(resolved,{credentials:'same-origin',cache:force?'reload':'default'});const payload=await response.json().catch(()=>({}));if(!response.ok||payload.ok===false)throw new Error(payload?.error?.message||`Request failed (${response.status})`);requestCache.set(resolved,{payload,expires:now+Math.max(1000,ttl)});return payload}
function key(v){return String(v||'').trim().toLowerCase()}
function tournamentURL(t){return t.url||t.chessUrl||(t.slug?`https://www.chess.com/tournament/${encodeURIComponent(t.slug)}`:'')}
function buildMedals(){medalMap=new Map();for(const t of Array.isArray(archive?.tournaments)?archive.tournaments:[]){for(const medal of ['gold','silver','bronze'])for(const raw of Array.isArray(t?.podium?.[medal])?t.podium[medal]:[]){const name=String(raw?.username||raw||'').trim();if(!name)continue;const k=key(name),row=medalMap.get(k)||{gold:0,silver:0,bronze:0,events:[]};row[medal]++;row.events.push({medal,name:t.name||t.title||t.slug||'Tournament',date:t.finishAt||t.end_time||'',url:tournamentURL(t)});medalMap.set(k,row)}}}
function medals(member){return medalMap.get(key(member.username))||{gold:0,silver:0,bronze:0,events:[]}}
function liveRank(points){const n=Number(points)||0,thresholds=[[15000,'Live King'],[7500,'Live Queen'],[2500,'Live Rook'],[500,'Live Bishop'],[150,'Live Knight'],[50,'Live Pawn']];return thresholds.find(([minimum])=>n>=minimum)?.[1]||'Unranked'}
function basicBadges(member){const m=medals(member),items=[];if(m.gold)items.push(`<span class="badge gold">🥇 ${m.gold} gold</span>`);if(m.silver)items.push(`<span class="badge silver">🥈 ${m.silver} silver</span>`);if(m.bronze)items.push(`<span class="badge bronze">🥉 ${m.bronze} bronze</span>`);if(member.daily_rank?.name&&member.daily_rank?.key!=='unranked')items.push(`<span class="badge special">★ ${esc(member.daily_rank.name)} Daily</span>`);if(Number(member.live_points)>=50)items.push(`<span class="badge special">★ ${esc(liveRank(member.live_points))}</span>`);return items.slice(0,4).join('')||'<span class="badge">No milestone yet</span>'}
function avatarHTML(username){const profile=profiles[key(username)]||{},src=profile.avatar||'';return src?`<img src="${esc(src)}" alt="${esc(username)} avatar" loading="lazy">`:'♔'}
function render(){const host=$('players');host.classList.toggle('players',view==='highlights');
 if(view==='leaderboard'){
   host.className='card';host.innerHTML=rows.length?`<div style="overflow:auto"><table class="leaderboard"><thead><tr><th>Rank</th><th>Player</th><th>Achievements</th><th>Daily Rank</th><th>Live Rank</th></tr></thead><tbody>${rows.map((p,index)=>`<tr><td class="rank">${integer.format((page>1?0:0)+index+1)}</td><td><button class="leaderboard-player" type="button" data-open-profile="${esc(p.username)}"><span class="avatar">${avatarHTML(p.username)}</span><strong>${esc(p.username)}</strong></button></td><td><strong>${integer.format(Number(p.achievement_count)||0)}</strong></td><td>${esc(p.daily_rank?.name||'Unranked')}</td><td>${esc(p.live_rank?.name||'Unranked')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No player matches the selected criteria.</div>';
 } else {
   host.className='players';host.innerHTML=rows.length?rows.map(p=>{const m=medals(p),total=m.gold+m.silver+m.bronze;return `<article class="player card" data-player="${esc(p.username)}" tabindex="0"><div class="player-head"><div class="avatar">${avatarHTML(p.username)}</div><div><h2>${esc(p.username)}</h2><small>${esc(p.daily_rank?.name||'Unranked')} · ${pointsFormat.format(Number(p.points)||0)} Team Points</small></div></div><div class="badges">${basicBadges(p)}</div><div class="facts"><div class="fact"><span>Tournament medals</span><strong>${integer.format(total)}</strong></div><div class="fact"><span>Achievements achieved</span><strong>${integer.format(Number(p.achievement_count)||0)}</strong></div></div><div class="card-actions"><button type="button" data-open-profile="${esc(p.username)}">View profile</button><button type="button" data-open-catalog="${esc(p.username)}">All achievements</button></div></article>`}).join(''):'<div class="empty card">No player matches the selected criteria.</div>';
 }
 document.querySelectorAll('[data-open-profile]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openPlayer(button.dataset.openProfile)}));
 document.querySelectorAll('[data-open-catalog]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openCatalog(button.dataset.openCatalog)}));
 document.querySelectorAll('.player').forEach(card=>{const open=()=>openPlayer(card.dataset.player);card.addEventListener('click',event=>{if(!event.target.closest('button'))open()});card.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('button')){event.preventDefault();open()}})});
 $('loadMore').hidden=page>=totalPages;$('loadMore').textContent=`Load more players (${Math.max(0,totalPages-page)} page${totalPages-page===1?'':'s'} remaining)`;resize()}
async function fetchAvatars(list){const names=list.filter(row=>row?.username&&!String(row.avatar||'').trim()&&!String(profiles[key(row.username)]?.avatar||'').trim()).map(row=>row.username);if(!names.length)return;try{const payload=await json(`server/team-points/public/player-cards.php?usernames=${encodeURIComponent(names.join(','))}`,30*86400000);profiles={...profiles,...(payload.profiles||{})}}catch(_){}}
async function hydrateMedals(list){const names=list.map(row=>String(row?.username||'').trim()).filter(Boolean);if(!names.length)return;try{const payload=await json(`server/tournaments/public/browse.php?view=medals&usernames=${encodeURIComponent(names.join(','))}`,300000);for(const [k,row] of Object.entries(payload.medals||{}))medalMap.set(key(k),{gold:Number(row?.gold)||0,silver:Number(row?.silver)||0,bronze:Number(row?.bronze)||0,events:Array.isArray(row?.tournaments)?row.tournaments:[]})}catch(_){}}
async function ensureMedallistNames(){const payload=await json('server/tournaments/public/browse.php?view=medalist_names',300000);return Array.isArray(payload.usernames)?payload.usernames:[]}
async function loadPage(reset=false){if(reset){page=1;rows=[];profiles={}}const filter=$('filter').value,params=new URLSearchParams({page:String(page),page_size:String(PAGE_SIZE),sort:'achievement_count',direction:'desc',search:''});if(filter==='milestones')params.set('filter','milestones');else params.set('filter','current');if(filter==='medallists'){const names=await ensureMedallistNames();if(!names.length){rows=[];totalPages=1;render();return}params.set('usernames',names.slice(0,250).join(','))}const payload=await json(`server/team-points/public/achievement-players.php?${params}`,120000),newRows=payload.rows||[];newRows.forEach(row=>{if(row?.username&&(row.avatar||row.profile_url))profiles[key(row.username)]={username:row.username,avatar:row.avatar||'',url:row.profile_url||'',country:row.country||'',status:row.profile_status||'',avatar_checked_at:row.avatar_checked_at||null}});totalPages=Number(payload.pagination?.total_pages)||1;if(reset)rows=newRows;else rows.push(...newRows);render();Promise.allSettled([fetchAvatars(newRows),hydrateMedals(newRows)]).then(render)}
async function load(){try{$('players').innerHTML='<div class="empty card">Loading achievement data…</div>';await loadPage(true)}catch(error){$('players').innerHTML=`<div class="empty card">${esc(error.message||'Achievement data is unavailable.')}</div>`;resize()}}
function tournamentAchievementKeys(member){const m=medals(member),total=m.gold+m.silver+m.bronze,keys=[];if(total>=1)keys.push('tournament-first-medal');if(m.gold>=1)keys.push('tournament-first-gold');if(total>=5)keys.push('tournament-medals-5');if(total>=10)keys.push('tournament-medals-10');return keys}
function displayBar(done,total,label='Achievement progress'){const complete=Math.max(0,Math.min(Number(total)||0,Number(done)||0)),count=Math.max(0,Number(total)||0),pct=count?Math.max(0,Math.min(100,100*complete/count)):0;if(count>10)return `<span class="display-bar is-progressive"><span class="display-track" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${complete}"><i style="width:${pct.toFixed(2)}%"></i></span></span>`;return `<span class="display-bar is-segmented" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${complete}"><span class="display-segments">${Array.from({length:count},(_,i)=>`<i class="${i<complete?'is-complete':''}"></i>`).join('')}</span></span>`}
let standaloneAchievementNav=null;function renderStandaloneAchievementDetail(index){const nav=standaloneAchievementNav;if(!nav||index<0||index>=nav.items.length)return;nav.index=index;const x=nav.items[index],item=x.item,earned=x.earned,progress=x.progress;const prog=!earned&&progress&&Number(progress.target)>0?`<div class="progress"><span>${esc(progress.progress_metric||'Progress')} · ${integer.format(Number(progress.current||0))} / ${integer.format(Number(progress.target||0))}</span><progress max="100" value="${Math.max(0,Math.min(100,Number(progress.progress_percent)||0))}"></progress></div>`:'';const rawDate=String(item?.earned_at||''),normalizedDate=rawDate.includes(' ')?rawDate.replace(' ','T')+'Z':rawDate,approx=["mca-interpolated","mca-upload-fallback"].includes(String(item?.earned_at_precision||'')),earnedDate=earned?(normalizedDate?`${dateText(normalizedDate)}${approx?' (approximative date)':''}`:item?.earned_at_precision==='tournament-pending'?'Date pending tournament refresh':'Stored achievement records do not contain an exact award date'):'';const dateHTML=earned?`<p class="achievement-date"><strong>Achievement date</strong><br>${esc(earnedDate)}</p>`:'';$('modalEyebrow').textContent='Achievement details';$('modalTitle').textContent=item.label||item.key;$('profile').innerHTML=`<div class="card-actions"><button id="achPrev" ${index===0?'disabled':''}>← Previous</button><button id="achBack">Back to catalogue</button><button id="achNext" ${index===nav.items.length-1?'disabled':''}>Next →</button></div><div class="profile-card"><div class="identity"><div class="avatar"><img style="object-fit:contain" src="${esc(item.icon||item.miniature||'assets/images/achievements/placeholders/generic.svg')}" alt="${esc(item.label||'Achievement')}"></div><div><h3>${esc(item.label||item.key)}</h3><p>${esc(item.criteria||item.description||'')}</p><small>${earned?'Earned':'Not earned yet'}</small>${dateHTML}${prog}</div></div></div>`;$('achPrev').onclick=()=>renderStandaloneAchievementDetail(index-1);$('achNext').onclick=()=>renderStandaloneAchievementDetail(index+1);$('achBack').onclick=()=>renderCatalog(nav.profile,nav.username,nav.progressPayload)}
function renderCatalog(profile,username='',progressPayload=null){const showCatalogueProgress=Boolean(username);const earnedItems=Array.isArray(profile?.achievements)?profile.achievements:[],progressRows=Array.isArray(progressPayload?.player?.member?.achievement_progress)?progressPayload.player.member.achievement_progress:[],progressMap=new Map(progressRows.map(x=>[String(x.key||''),x])),metricEarned=new Set(progressRows.filter(x=>Number(x?.target)>0&&Number(x?.current)>=Number(x?.target)).map(x=>String(x.key||''))),earned=new Set([...earnedItems.map(item=>String(item.key||'')),...metricEarned]),earnedMap=new Map(earnedItems.map(x=>[String(x.key||''),x]));metricEarned.forEach(k=>{if(!earnedMap.has(k))earnedMap.set(k,{key:k,level:'earned',earned_at:null,earned_at_precision:'metric-reconciled'})});const families=new Map();catalog.forEach(item=>{const family=String(item.family||'other'),category=String(item.category||'other');if(!families.has(family))families.set(family,{label:String(item.family_label||family).trim()||'Other',items:[],groups:new Map()});const f=families.get(family);f.items.push(item);if(!f.groups.has(category))f.groups.set(category,{label:String(item.category_label||category.replace(/-/g,' ')).trim(),items:[]});f.groups.get(category).items.push(item)});
const familyHTML=[...families.entries()].map(([familyKey,family])=>{const familyDone=family.items.filter(item=>earned.has(String(item.key||''))).length,total=family.items.length;const groups=[...family.groups.entries()].map(([category,group])=>{const done=group.items.filter(item=>earned.has(String(item.key||''))).length,count=group.items.length,cards=group.items.map(item=>{const k=String(item.key||''),has=earned.has(k),pr=progressMap.get(k),prog=!has&&pr&&Number(pr.target)>0?`<div class="progress"><span>${esc(pr.progress_metric||'Progress')} · ${integer.format(Number(pr.current||0))} / ${integer.format(Number(pr.target||0))}</span><progress max="100" value="${Math.max(0,Math.min(100,Number(pr.progress_percent)||0))}"></progress></div>`:'';return `<button type="button" class="achievement ${has?'is-earned':''}" data-achievement-key="${esc(item.key||'')}" data-achievement-name="${esc(item.label||item.key||'')}" data-achievement-category="${esc(category)}"><img src="${esc(item.miniature||item.icon||'assets/images/achievements/placeholders/generic.svg')}" alt="${esc(item.label)}" loading="lazy" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='assets/images/achievements/placeholders/generic.svg'}"><div><h3>${esc(item.label)}</h3><p>${esc(item.criteria||item.description||'')}</p><small>${has?'Earned':'Achievable'}</small>${prog}</div></button>`}).join('');return `<section class="achievement-group" data-achievement-group="${esc(category)}"><header class="group-head"><div><h3>${esc(group.label)}</h3><small>${integer.format(done)} / ${integer.format(count)} achieved</small></div>${showCatalogueProgress?displayBar(done,count,`${group.label} progress`):""}</header><div class="catalog-grid">${cards}</div></section>`}).join('');return `<details class="achievement-family" data-achievement-family="${esc(familyKey)}"><summary><span class="family-copy"><strong>${esc(family.label)}</strong><small>${integer.format(familyDone)} / ${integer.format(total)} achieved</small></span>${showCatalogueProgress?displayBar(familyDone,total,`${family.label} progress`):""}<span class="family-chevron" aria-hidden="true"></span></summary><div class="family-body">${groups}</div></details>`}).join('');
$('profile').innerHTML=`<div class="catalog-search"><label><span>Search achievement names</span><input id="catalogSearch" type="search" autocomplete="off" placeholder="Type an achievement name…"></label><small id="catalogSearchCount">${integer.format(catalog.length)} achievements</small></div>${familyHTML}`;const input=$('catalogSearch'),counter=$('catalogSearchCount');if(input)input.addEventListener('input',()=>{const q=String(input.value||'').trim().toLocaleLowerCase('en'),cards=[...$('profile').querySelectorAll('[data-achievement-name]')];let visible=0;cards.forEach(card=>{const match=!q||String(card.dataset.achievementName||'').toLocaleLowerCase('en').includes(q);card.hidden=!match;if(match)visible++});$('profile').querySelectorAll('.achievement-group').forEach(group=>{group.hidden=![...group.querySelectorAll('[data-achievement-name]')].some(card=>!card.hidden)});$('profile').querySelectorAll('.achievement-family').forEach(family=>{const any=[...family.querySelectorAll('[data-achievement-name]')].some(card=>!card.hidden);family.hidden=!any;if(q&&any)family.open=true});if(counter)counter.textContent=`${integer.format(visible)} of ${integer.format(cards.length)} achievements`});standaloneAchievementNav={items:catalog.map(item=>{const k=String(item.key||'');return{item:earnedMap.has(k)?{...item,...earnedMap.get(k)}:item,earned:earned.has(k),progress:progressMap.get(k)||null}}),profile,username,progressPayload,index:0};$('profile').querySelectorAll('[data-achievement-key]').forEach(btn=>btn.addEventListener('click',()=>{const k=String(btn.dataset.achievementKey||''),i=standaloneAchievementNav.items.findIndex(x=>String(x.item.key||'')===k);renderStandaloneAchievementDetail(i)}));$('modal').scrollTop=0}
async function openPopular(){try{if(!catalog.length){const j=await json('server/team-points/public/achievements.php',300000);catalog=j.catalog||[]}const sorted=[...catalog].sort((a,b)=>Number(b.earned_current_member_count||0)-Number(a.earned_current_member_count||0)||String(a.label||a.key).localeCompare(String(b.label||b.key)));$('modalEyebrow').textContent='Achievement popularity';$('modalTitle').textContent='Most earned achievements';$('profile').innerHTML=`<div class="catalog-grid">${sorted.map((item,i)=>`<article class="achievement"><img src="${esc(item.miniature||item.icon||'assets/images/achievements/placeholders/generic.svg')}" alt="${esc(item.label||'Achievement')}"><div><h3>${integer.format(i+1)}. ${esc(item.label||item.key)}</h3><p>${esc(item.description||item.criteria||'')}</p><small>${integer.format(Number(item.earned_current_member_count||0))} current player${Number(item.earned_current_member_count||0)===1?'':'s'}</small></div></article>`).join('')}</div>`;$('modal').hidden=false;document.body.style.overflow='hidden';$('modal').scrollTop=0;$('close').focus()}catch(error){showLoadError(error)}}
async function openCatalog(username=''){if(embedded){parent.postMessage({type:'p2k-open-achievement-catalog',username:String(username||'')},location.origin);return}$('modalEyebrow').textContent='Achievement catalogue';$('modalTitle').textContent=username?`${username} · all achievements`:'All achievable achievements';$('profile').innerHTML='<p class="status">Loading achievement catalogue…</p>';$('modal').hidden=false;document.body.style.overflow='hidden';try{const tasks=[];if(!catalog.length)tasks.push(json('server/team-points/public/achievements.php',300000).then(j=>{catalog=j.catalog||[]}));let profile=null,progressPayload=null;if(username){tasks.push(json(`server/team-points/public/player-profile.php?mode=modal&username=${encodeURIComponent(username)}`,120000).then(j=>{profile=j.player||null}));tasks.push(json(`server/team-points/public/member-intelligence.php?username=${encodeURIComponent(username)}`,120000).then(j=>{progressPayload=j||null}))}await Promise.all(tasks);renderCatalog(profile,username,progressPayload)}catch(error){$('profile').innerHTML=`<p class="status error">${esc(error.message||'Achievement catalogue unavailable.')}</p>`}$('close').focus()}
async function openPlayer(username){if(embedded){parent.postMessage({type:'p2k-open-player-profile',username},location.origin);return}const member=rows.find(p=>key(p.username)===key(username))||{username};$('modalEyebrow').textContent='Unified player profile';$('modalTitle').textContent=member.username;$('profile').innerHTML='<p class="status">Loading unified database profile…</p>';$('modal').hidden=false;document.body.style.overflow='hidden';try{const payload=await json(`server/team-points/public/player-profile.php?mode=modal&username=${encodeURIComponent(member.username)}`,120000),p=payload.player||{},card={avatar:p.avatar||profiles[key(member.username)]?.avatar||'',url:p.profile_url||profiles[key(member.username)]?.url||''};$('profile').innerHTML=`<div class="profile-summary"><section class="profile-card"><div class="identity"><div class="avatar">${card.avatar?`<img src="${esc(card.avatar)}" alt="${esc(p.username||member.username)} avatar">`:'♔'}</div><div><h3>${esc(p.username||member.username)}</h3><p>${esc(p.rank?.name||'Unranked')} Daily · ${esc(p.live?.rank_name||'Unranked')} Live</p></div></div><div class="large-badges"><div class="large-badge"><span>Team Points</span><strong>${pointsFormat.format(Number(p.points)||0)}</strong></div><div class="large-badge"><span>Team games</span><strong>${integer.format(Number(p.games)||0)}</strong></div><div class="large-badge"><span>MCA points</span><strong>${pointsFormat.format(Number(p.live?.points)||0)}</strong></div><div class="large-badge"><span>Live rank</span><strong>${esc(p.live?.rank_name||'Unranked')}</strong></div></div><div class="card-actions"><button type="button" id="profileCatalog">View all achievements of ${esc(p.username||member.username)}</button></div></section><section class="history"><h3>Tournament achievement history</h3><div class="timeline" id="profileTournamentHistory"><p class="status">Loading tournament history…</p></div></section></div>`;$('profileCatalog').addEventListener('click',()=>openCat
