<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Promote to King · League and season centre</title><script src="config/site-branding.js?v=2.10.6"></script><script src="assets/js/site-config.js?v=2.10.9.1"></script><script defer src="assets/js/shared/real-oauth.js?v=2.10.6"></script><script src="assets/js/shared/simulated-oauth.js?v=2.10.6"></script><script defer src="assets/js/shared/authenticated-member-refresh.js?v=2.10.6"></script><script src="assets/js/shared/admin-page-guard.js?v=2.10.6"></script><style>html.admin-access-pending body{visibility:hidden}</style><style>:root{color-scheme:dark;--text:#f1e5d2;--muted:#aaa198;--gold:#f6b73c;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:#100f0e;color:var(--text);font:14px/1.45 Arial,sans-serif}main{max-width:1300px;margin:auto;padding:22px}.hero,.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#25211d,#151311);box-shadow:0 12px 35px #0005}.hero{padding:18px}.hero h1{margin:0;color:var(--gold)}.hero p{margin:5px 0 0;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#201c18;color:var(--text);cursor:pointer}.filters button.active{border-color:#f6b73c88;color:#ffd078}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:14px}.head{display:flex;justify-content:space-between;gap:12px}.head h2{margin:0;color:#ffd078}.head span{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.stat{padding:8px;border:1px solid #ffffff10;border-radius:8px;background:#0002}.stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat strong{display:block;margin-top:3px}.upcoming{display:grid;gap:6px}.upcoming a{display:flex;justify-content:space-between;gap:10px;padding:8px;border:1px solid #ffffff10;border-radius:8px;color:#82c8ff;text-decoration:none}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><section class="hero"><h1>League and season centre</h1><p>Administrator overview generated from database match metadata and immutable match summaries. League detection covers 1WL, TCMAC, KOTML, TMCL, WKCL, PCL and CW.</p><div id="meta"></div></section><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let rows=[],selected='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const view=selected==='all'?rows:rows.filter(r=>r.league===selected);$('grid').innerHTML=view.length?view.map(r=>`<article class="card"><div class="head"><h2>${esc(r.league)} · ${esc(r.season)}</h2><span>${r.matches} matches</span></div><div class="stats"><div class="stat"><span>W / D / L</span><strong>${r.wins} / ${r.draws} / ${r.losses}</strong></div><div class="stat"><span>Club Points</span><strong>${Math.round(Number(r.club_points)||0)}</strong></div><div class="stat"><span>Boards</span><strong>${r.boards}</strong></div><div class="stat"><span>Current</span><strong>${r.registered} reg. · ${r.ongoing} live</strong></div></div><p>${r.opponents.length} opponent${r.opponents.length===1?'':'s'}: ${esc(r.opponents.slice(0,6).join(', ')||'—')}</p><div class="upcoming">${(r.upcoming||[]).map(m=>`<a href="${esc(m.url||'#')}" target="_blank" rel="noopener"><span>${esc(m.name)}</span><b>${esc(m.status)}</b></a>`).join('')||'<span class="empty">No current match in this season.</span>'}</div></article>`).join(''):'<div class="empty card">No league season matches are stored.</div>'}async function load(){try{const r=await fetch('server/team-points/public/league-seasons.php',{cache:'no-store',credentials:'same-origin'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j?.error?.message||`HTTP ${r.status}`);rows=j.seasons||[];$('meta').textContent=`Database schema ${j.meta?.schema_version||'—'} · updated ${j.meta?.last_database_update?new Date(j.meta.last_database_update).toLocaleString('en-GB',{timeZone:'UTC',hour12:false}):'unknown'}`;const leagues=['all',...(j.leagues||[])];$('filters').innerHTML=leagues.map(l=>`<button data-league="${l}" class="${l==='all'?'active':''}">${l==='all'?'All leagues':l}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.league;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});render()}catch(e){$('grid').innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}load()})();</script></body></html>
