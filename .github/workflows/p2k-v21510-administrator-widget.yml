name: P2K 2.15.10 Administrator widget qualification and Release Control ZIP
on:
  push:
    branches: [release/v2.15.10]
    paths:
      - '.github/workflows/p2k-v21510-administrator-widget.yml'
      - 'server/widgets/public/administrator.php'
      - 'assets/js/widgets/p2k-administrator-v21510.js'
      - 'assets/css/widgets/p2k-administrator-v21510.css'
      - 'server/widgets/src/WidgetConfigStore.php'
      - 'server/widgets/public/embed.php'
      - 'assets/js/admin/widgets-v2153.js'
      - 'assets/js/admin/admin-shell.js'
      - 'assets/js/admin/admin-session-controller.js'
      - 'assets/js/admin/tool-registry.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP JavaScript and admin isolation
        shell: bash
        run: |
          set -euo pipefail
          php -l server/widgets/public/administrator.php
          php -l server/widgets/public/embed.php
          php -l server/widgets/src/WidgetConfigStore.php
          node --check assets/js/widgets/p2k-administrator-v21510.js
          node --check assets/js/admin/widgets-v2153.js
          node --check assets/js/admin/admin-shell.js
          node --check assets/js/admin/admin-session-controller.js
          node tests/test_v21510_administrator_widget_actions.js
          node --check assets/js/admin/tool-registry.js
          php tests/showcase-admin-discovery.php
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          s=Path('server/widgets/public/embed.php').read_text()
          p=Path('server/widgets/public/administrator.php').read_text()
          j=Path('assets/js/widgets/p2k-administrator-v21510.js').read_text()
          assert s.index("if ($widget==='administrator')")<s.index("header('Content-Type: text/html")
          assert "Auth::requireAdmin()" in s and "Auth::requireAdmin()" in p
          assert "PublicReadDatabase::core()" in p and "verified_club_slug" in p
          assert 'scope=actions' not in j and 'scope=freshness' in j and 'member-events' in j and 'member-lookup' in j
          assert 'arena-scan-page' in j and 'requestKind:' in j
          assert 'resolve-club' in p and 'resolve-club' in j and 'api.chess.com/pub/club/' in p
          assert 'p2k_g_match_players' in p and 'awDayMatches' in p and 'awMembersIndex' in p
          assert 'p2k-administrator-widget-queue-request' in j
          assert 'p2k-administrator-widget-queue-response' in Path('assets/js/admin/admin-session-controller.js').read_text()
          base='031a12ecc8334e8c0ab3d2303effb11dc7f3a303'
          changed=set(check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          forbidden={'server/events-showcase/public/api.php','server/events-showcase/public/embed.php',
             'server/events-showcase/public/embed-card.php','server/events-showcase/src/EventsShowcaseStore.php',
             'assets/js/widgets/p2k-competition-v2159.js','assets/js/shared/events-showcase-core.js'}
          assert not (changed&forbidden),changed&forbidden
          assert 'administrator' in Path('server/widgets/src/WidgetConfigStore.php').read_text()
          print('PASS protected-only administrator UI, Green provenance, existing admin reuse, public Showcase isolation')
          PY
      - name: Build cumulative Release Control candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,subprocess,zipfile
          root=Path('.')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          cache_key='p2k-2.15.10-'+head[:12]+'-'+sha256((head+'|administrator-widget').encode()).hexdigest()[:16]
          package=Path('dist/P2K_2.15.10_Administrator_Widget_ReleaseControl')
          payload=package/'payload'
          payload.mkdir(parents=True,exist_ok=True)
          overlay=['VERSION','ui-v2.html',
            'server/widgets/public/administrator.php',
            'assets/js/widgets/p2k-administrator-v21510.js',
            'assets/css/widgets/p2k-administrator-v21510.css',
            'server/widgets/src/WidgetConfigStore.php',
            'server/widgets/public/embed.php',
            'assets/js/admin/widgets-v2153.js',
            'assets/js/admin/admin-shell.js',
            'assets/js/admin/tool-registry.js',
            'assets/js/admin/admin-session-controller.js']
          recovery=['ReleaseControl.php','server/release-control/src/bootstrap.php',
            'server/release-control/src/ReleasePackageUploadInstaller.php',
            'server/release-control/src/FilesystemCleanupManager.php']
          for name in overlay+recovery:
            if name in ('VERSION','ui-v2.html'): continue
            target=payload/name
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes((root/name).read_bytes())
          (payload/'VERSION').write_text('2.15.10\n')
          html=(root/'ui-v2.html').read_text()
          old='assets/js/admin/tool-registry.js?v=p2k-2.15.9-competition-12'
          new='assets/js/admin/tool-registry.js?v=p2k-2.15.10-administrator-'+head[:12]
          assert html.count(old)==1
          html=html.replace(old,new)
          html=html.replace('assets/js/admin/admin-shell.js?v=p2k-2.15.9-competition-1',
                            'assets/js/admin/admin-shell.js?v=p2k-2.15.10-administrator-'+head[:12])
          session_old='assets/js/admin/admin-session-controller.js?v=2.11.5-bf6a828490f57'
          assert html.count(session_old)==1
          html=html.replace(session_old,'assets/js/admin/admin-session-controller.js?v=p2k-2.15.10-administrator-'+head[:12])
          html=html.replace('<head>','<head>\n<meta name="p2k-build" content="'+cache_key+'">',1)
          (payload/'ui-v2.html').write_text(html)
          sha=lambda p:sha256(p.read_bytes()).hexdigest()
          (package/'CANDIDATE_PAYLOAD.sha256').write_text(''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(overlay)))
          (package/'RECOVERY_PLANE.sha256').write_text(''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(recovery)))
          meta={'schema_version':1,'version':'2.15.10','source_head':head,
                'cache_key':cache_key,
                'build_id':'p2k-administrator-v21510-'+head[:12],
                'qualification_workflow':'p2k-v21510-administrator-widget.yml',
                'payload_manifest_sha256':sha(package/'CANDIDATE_PAYLOAD.sha256'),
                'accepted_public_builds':[{'version':'2.15.10','source_head':'e6c543c086188458f00a6d0080c9726f171b650e'},
                     {'version':'2.15.10','source_head':'031a12ecc8334e8c0ab3d2303effb11dc7f3a303'}]}
          (package/'CANDIDATE_RELEASE.json').write_text(json.dumps(meta,indent=2)+'\n')
          (package/'README.txt').write_text('P2K 2.15.10 Administrator widget. Upload through Release Control, preview, then promote manually.\n'
            'Admin-only Actions, 7-day Matches/Boards, Members and Showcase views. No live DB, cron or configuration changes.\n')
          output=package.parent/('P2K_2.15.10_Administrator_Widget_ReleaseControl_'+head[:12]+'.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(package.rglob('*')):
              if p.is_file():z.write(p,p.relative_to(package))
          (package.parent/'SHA256SUMS').write_text(sha(output)+'  '+output.name+'\n')
          print('ZIP:',output,'size:',output.stat().st_size,'sha256:',sha(output))
          PY
      - name: Validate Release Control candidate
        run: |
          set -euo pipefail
          php -r '
            require "server/release-control/src/ReleaseSlotPolicy.php";
            require "server/release-control/src/ReleaseCandidatePackage.php";
            $p = new \P2K\ReleaseControl\ReleaseCandidatePackage($argv[1]);
            $m = $p->validate();
            if ($m["overlay_file_count"] !== 11 || $m["version"] !== "2.15.10") exit(2);
            echo "PASS candidate ".$m["release_id"]."\n";
          ' dist/P2K_2.15.10_Administrator_Widget_ReleaseControl
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          zpath=next(Path('dist').glob('P2K_2.15.10_Administrator_Widget_ReleaseControl_*.zip'))
          with zipfile.ZipFile(zpath) as z:
            assert z.testzip() is None
            names=z.namelist()
            assert len(names)==19 and len(set(names))==19
            assert all('..' not in p.split('/') and not p.startswith('/') for p in names)
            meta=json.loads(z.read('CANDIDATE_RELEASE.json'))
            assert meta['accepted_public_builds']==[{'version':'2.15.10','source_head':'e6c543c086188458f00a6d0080c9726f171b650e'},
              {'version':'2.15.10','source_head':'031a12ecc8334e8c0ab3d2303effb11dc7f3a303'}]
            for manifest in ('CANDIDATE_PAYLOAD.sha256','RECOVERY_PLANE.sha256'):
              for entry in z.read(manifest).decode().splitlines():
                h,p=entry.split('  ./',1)
                assert hashlib.sha256(z.read('payload/'+p)).hexdigest()==h,p
          print('PASS Release Control ZIP safety, compatibility and manifest hashes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-v21510-administrator-widget-release-control
          path: |
            dist/P2K_2.15.10_Administrator_Widget_ReleaseControl_*.zip
            dist/SHA256SUMS
          retention-days: 14
