name: P2K vote chess index read-only probe
on:
  workflow_dispatch:
  push:
    branches: [release/v2.16.2]
    paths: ['.github/workflows/p2k-vote-chess-index-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect anonymous HTML and public API
        shell: bash
        run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, html
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.text=[]; self.a=None; self.skip=0; self.scripts=[]; self.rows=[]; self.row=None
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t in ('script','style'): self.skip+=1
                  if t=='script' and a.get('src'): self.scripts.append(a['src'])
                  if t=='a': self.a=[a.get('href',''),[],a.get('title','')]
                  if t=='tr': self.row=[]
              def handle_endtag(self,t):
                  if t in ('script','style'): self.skip=max(0,self.skip-1)
                  if t=='a' and self.a:
                      self.links.append([self.a[0],' '.join(self.a[1]),self.a[2]]); self.a=None
                  if t=='tr' and self.row is not None: self.rows.append(' '.join(self.row)); self.row=None
              def handle_data(self,d):
                  d=' '.join(d.split())
                  if not d or self.skip: return
                  self.text.append(d)
                  if self.a: self.a[1].append(d)
                  if self.row is not None: self.row.append(d)
          paths=['/groups/votechess/promote-to-king','/club/votechess/promote-to-king','/clubs/currentevents/promote-to-king?type=vote','/clubs/upcomingevents/promote-to-king?type=vote','/clubs/pastevents/promote-to-king?type=vote','/clubs/pastevents/promote-to-king?type=vote&page=2','/clubs/pastevents/promote-to-king','/clubs/currentevents/promote-to-king','/clubs/currentevents/torre-attack-chess-club?type=vote','/club/votechess/promote-to-king?status=completed','/votechess','/votechess/game/410433']
          urls=['https://www.chess.com'+p for p in paths]+['https://api.chess.com/pub/club/promote-to-king/matches']
          for i,url in enumerate(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36','Accept':'text/html,application/json','Accept-Language':'en-US,en;q=0.9'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(4000000).decode('utf-8','replace')
                      print('HTTP',r.status,r.url,r.headers.get('Content-Type'),len(body))
              except urllib.error.HTTPError as e:
                  body=e.read(200000).decode('utf-8','replace'); print('HTTP_ERROR',e.code,e.url,body[:500])
              except Exception as e: print('ERROR',url,str(e)); continue
              open('probe/raw-'+str(i)+'.txt','w').write(body)
              if 'api.chess.com' in url:
                  try:
                      j=json.loads(body); print('API_KEYS',[(k,len(v) if isinstance(v,list) else type(v).__name__) for k,v in j.items()]); print('API_VOTE',[(k,str(v)[:4500]) for k,v in j.items() if 'vote' in k.lower()]); entries=[x for v in j.values() if isinstance(v,list) for x in v]; hits=[x for x in entries if re.search(r'vote.?chess|/vote(?:/|$)|"vote"',json.dumps(x),re.I)]; print('API_ENTRY_VOTE',len(hits),hits[:3], 'KEYS', sorted({k for x in entries if isinstance(x,dict) for k in x}))
                  except Exception as e: print('API_PARSE_ERROR',str(e))
                  continue
              p=Parser(); p.feed(body)
              print('PAGE_SUMMARY',i,url,'GAME_IDS',sorted(set(re.findall(r'/votechess/game/(\d+)',body))),'PAGE_LINKS',[(a,b) for a,b,t in p.links if re.search(r'[?&]page=|/clubs/(?:past|current|upcoming)events',a)][:25])
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)[:1])
              print('VISIBLE_TEXT',json.dumps(p.text[:350],ensure_ascii=False))
              for row in p.rows[:100]: print('TABLE_ROW',row)
              for href,label,title in p.links:
                  if any(k in (href+' '+label).lower() for k in ('vote','page=','next','previous','completed','current','open','registration')): print('LINK',json.dumps([href,label,title],ensure_ascii=False))
              print('SCRIPTS',p.scripts[:25])
              print('MARKERS',{k:body.lower().count(k) for k in ['votechess','vote-chess','__next_data__','__nuxt__','graphql','pagination','data-game','data-match']})
              for m in list(re.finditer(r'(?i)(?:data-[\w-]*(?:vote|game|match)[\w-]*|/votechess/|/vote-chess/)',body))[:2]: print('HTML_CONTEXT',re.sub(r'\s+',' ',body[max(0,m.start()-70):m.start()+160]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vote-chess-historical-probe
          path: probe/
          retention-days: 3
