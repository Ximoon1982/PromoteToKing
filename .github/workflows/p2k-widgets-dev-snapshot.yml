name: P2K Widgets development source snapshot
on:
  push:
    paths:
      - '.github/workflows/p2k-widgets-dev-snapshot.yml'
      - 'assets/js/admin/**'
      - 'server/events-showcase/**'
      - 'server/widgets/**'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot for offline local development
        run: |
          mkdir -p dist
          zip -q -r dist/p2k-widgets-dev-source.zip \
            TeamPointsAdmin.html \
            assets/js/admin \
            assets/css/dashboard-v2.css \
            assets/js/pages/dashboard-insights.js \
            assets/js/pages/dashboard-insights-charts.js \
            server/events-showcase \
            server/trophy-gallery/src \
            server/trophy-gallery/public \
            server/team-points/src/PublicReadDatabase.php \
            server/team-points/public/team-insights.php \
            server/team-points/public/matches-insights.php \
            server/team-points/public/recent-matches.php \
            server/team-points/public/opponents.php \
            server/team-points/public/opponent-profile.php \
            server/team-points/public/public.php \
            api/_common.php \
            tests/test_events_showcase_contract.py
          unzip -t dist/p2k-widgets-dev-source.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-widgets-dev-source
          path: dist/p2k-widgets-dev-source.zip
          retention-days: 1
