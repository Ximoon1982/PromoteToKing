name: P2K v2.10.7 materialize

on:
  push:
    branches:
      - next/v2.10.7
    paths:
      - .p2k/v2107/PAYLOAD_URL

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and materialize exact v2.10.7 delta
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_DELTA_SHA='300d8d5612dfe002d7cbbefe0b1cff9e2de3db8918dfd1a4734c1d6dbc8a278f'
          URL="$(tr -d '\r\n' < .p2k/v2107/PAYLOAD_URL)"
          test -n "$URL"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/p2k-v2107-delta.tar.gz "$URL"
          echo "$EXPECTED_DELTA_SHA  /tmp/p2k-v2107-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/p2k-v2107-delta.tar.gz -C .

          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path('.')
          manifest_path = root / 'SOURCE_MANIFEST_v2.10.7.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files', [])
          if len(files) != 2497:
              raise SystemExit(f'expected 2497 manifest entries, got {len(files)}')
          failures = []
          for item in files:
              p = root / item['path']
              if not p.is_file():
                  failures.append(f"missing {item['path']}")
                  continue
              size = p.stat().st_size
              if size != item['size']:
                  failures.append(f"size {item['path']} {size} != {item['size']}")
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              if h != item['sha256']:
                  failures.append(f"sha256 {item['path']} {h} != {item['sha256']}")
          if failures:
              print('\n'.join(failures[:50]), file=sys.stderr)
              raise SystemExit(f'{len(failures)} manifest validation failures')
          if (root/'VERSION').read_text().strip() != '2.10.7':
              raise SystemExit('VERSION is not 2.10.7')
          if (root/'MIGRATION_VERSION').read_text().strip() != '2.10.7':
              raise SystemExit('MIGRATION_VERSION is not 2.10.7')
          print('Manifest validation PASS: 2497/2497')
          PY

          php -l server/team-points/src/AchievementCatalog.php
          php -l server/team-points/src/AnalyticsBuilder.php
          php -l server/team-points/src/ClubIntelligenceService.php
          python3 tests/test_v2107_release.py

          rm -f .p2k/v2107/PAYLOAD_URL
          rm -rf .p2k/v2107/probe
          rm -f .p2k/v2107/CANVA_PROBE
          rm -f .github/workflows/p2k-v2107-canva-probe.yml
          rm -f .github/workflows/p2k-v2107-materialize.yml

          git config user.name 'P2K Release Automation'
          git config user.email 'p2k-release@users.noreply.github.com'
          git add -A
          git commit -m 'release: Promote to King v2.10.7'
          git push origin HEAD:next/v2.10.7
