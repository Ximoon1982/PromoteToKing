name: Team France Medal Engraver source verification
on:
  push:
    branches: [release/v2.16.1]
    paths: ['TeamFrance/MedalEngraver/**','tools/*team-france-medal-engraver*','.github/workflows/team-france-medal-engraver-v010.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l TeamFrance/MedalEngraver/index.php
          php -l TeamFrance/MedalEngraver/view.php
          node --check TeamFrance/MedalEngraver/engraver.js
          bash -n tools/install-team-france-medal-engraver-v010.sh
          python3 -m py_compile tools/build-team-france-medal-engraver-v010.py
          grep -Fq '/TeamFrance/MedalEngraver/' TeamFrance/home.html
          mkdir -p "$RUNNER_TEMP/source/TeamFrance" "$RUNNER_TEMP/source/tools"
          cp -a TeamFrance/MedalEngraver TeamFrance/home.html "$RUNNER_TEMP/source/TeamFrance/"
          cp tools/*team-france-medal-engraver* "$RUNNER_TEMP/source/tools/"
      - uses: actions/upload-artifact@v4
        with:
          name: TeamFrance-Medal-Engraver-source
          path: ${{ runner.temp }}/source/
          include-hidden-files: true
          if-no-files-found: error
