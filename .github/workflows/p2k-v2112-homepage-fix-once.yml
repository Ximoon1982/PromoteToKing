name: P2K v2.11.2 homepage fix once

on:
  push:
    branches: [release/v2.11.2]
    paths:
      - .github/workflows/p2k-v2112-homepage-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.11.2
          fetch-depth: 0

      - name: Apply exact locally-qualified dependency wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "assets/js/admin/admin-session-controller.js": [(
              'const { state, byId, escapeHTML, number, setText, showToast, config, clubSlug, clubProfileAPI, loadJSON, setAdmin, renderView, writeNavigationState, adminShellOpenDetail, adminShellHref } = context;',
              'const { state, byId, escapeHTML, number, setText, showToast, config, clubSlug, clubProfileAPI, loadJSON, setAdmin, renderView, writeNavigationState, adminShellOpenDetail, adminShellHref, ensureAdminInterface, preservedURL, formatRelative, showInsightsModal, openMatchDetail } = context;'
            )],
            "assets/js/admin/admin-shell.js": [(
              'const { state, byId, escapeHTML, number, setText, applyOAuthContext, setIntegratedFrameActivity, ensureIntegratedFrame, writeNavigationState } = context;',
              'const { state, byId, escapeHTML, number, setText, applyOAuthContext, setIntegratedFrameActivity, ensureIntegratedFrame, writeNavigationState, tools } = context;'
            )],
            "assets/js/dashboard/insights-controller.js": [(
              'const { state, byId, escapeHTML, number, setText, nativeLink, cellWithSub, statusChip, loadPublicCachedJSON, writeNavigationState, rankThumbnailAsset, originalRankAsset, adminEntryUsername, selectHallSubtab, showPublicPage, formatDateOnly } = context;',
              'const { state, byId, escapeHTML, number, setText, nativeLink, cellWithSub, statusChip, loadPublicCachedJSON, loadJSON, writeNavigationState, rankThumbnailAsset, originalRankAsset, adminEntryUsername, selectHallSubtab, showPublicPage, formatDateOnly, formatRelative, matchRulesLabel, matchTimeControlLabel, challengeProgress } = context;'
            )],
            "assets/js/pages/dashboard-v2.js": [
              (
                'const publicReadCache = new Map();',
                'const challengeProgress = member => Array.isArray(member?.challenges) && member.challenges.length ? member.challenges : Array.isArray(member?.achievement_progress) ? member.achievement_progress : [];\nconst matchURL = match => String(match?.url || match?.["@id"] || "").replace("https://api.chess.com/pub/match/", "https://www.chess.com/club/matches/");\nconst publicReadCache = new Map();'
              ),
              (
                'loadJSON, setAdmin, renderView, writeNavigationState,\nadminShellOpenDetail: (...args) => adminShellOpenDetail(...args),',
                'loadJSON, setAdmin, renderView, writeNavigationState, ensureAdminInterface, preservedURL, formatRelative,\nshowInsightsModal: (...args) => showInsightsModal(...args),\nopenMatchDetail: (...args) => openMatchDetail(...args),\nadminShellOpenDetail: (...args) => adminShellOpenDetail(...args),'
              ),
              (
                '});\nconst { adminDetailDefinition, adminShellHref, adminShellCard,',
                '});\nconst { tools, renderTools, routeFallback } = window.P2K_DASHBOARD_MODULES.adminTools.create({ byId, integratedAdminHref, preservedURL, config });\nconst { adminDetailDefinition, adminShellHref, adminShellCard,'
              ),
              (
                'ensureIntegratedFrame: (...args) => ensureIntegratedFrame(...args), writeNavigationState\n});',
                'ensureIntegratedFrame: (...args) => ensureIntegratedFrame(...args), writeNavigationState, tools\n});'
              ),
              (
                'loadPublicCachedJSON, writeNavigationState, rankThumbnailAsset, originalRankAsset,\n    adminEntryUsername, selectHallSubtab, showPublicPage, formatDateOnly',
                'loadPublicCachedJSON, loadJSON, writeNavigationState, rankThumbnailAsset, originalRankAsset,\n    adminEntryUsername, selectHallSubtab, showPublicPage, formatDateOnly, formatRelative,\n    matchRulesLabel, matchTimeControlLabel, challengeProgress'
              ),
              (
                'showPublicPage, selectHallSubtab, openAchievementCatalog, loadPublicCachedJSON,\n    writeNavigationState, verifyAdmin,',
                'showPublicPage, selectHallSubtab, openAchievementCatalog, loadPublicCachedJSON, loadJSON,\n    writeNavigationState, verifyAdmin,'
              ),
              (
                'ranks, unrankedRank, rankThumbnailAsset, originalRankAsset\n  });',
                'ranks, unrankedRank, rankThumbnailAsset, originalRankAsset, clubProfileAPI, formatDateOnly, matchURL\n  });'
              ),
              (
                'writeNavigationState, adminDetailDefinition, renderAdminPriorityCard\n  });',
                'writeNavigationState, adminDetailDefinition, renderAdminPriorityCard, renderTeamIndicators, formatDateOnly\n  });'
              ),
              (
                'const { matchListLabel, renderDashboardMatchListRows, openDashboardMatchList, closeDashboardMatchList } = window.P2K_DASHBOARD_MODULES.matchListDialog.create({ state, byId, matchBoardCount, matchListTotals, number });\nconst { renderTools, routeFallback } = window.P2K_DASHBOARD_MODULES.adminTools.create({ byId, integratedAdminHref, preservedURL, config });',
                'const { matchListLabel, renderDashboardMatchListRows, openDashboardMatchList, closeDashboardMatchList } = window.P2K_DASHBOARD_MODULES.matchListDialog.create({ state, byId, matchBoardCount, matchListTotals, number, setText, formatDateOnly });'
              )
            ]
          }

          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{name}: expected exactly one occurrence, found {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          expected_session=2c911e19a1fdd63cc982d643133a8202de04615b
          expected_shell=4fd5d31f549c45337c7ed50d9732850b35934dd8
          expected_insights=adf6e652928d4003c66de5c758cc60df112f1954
          expected_dashboard=26eca51f0c217dc61d2abdc8f3b43082ac29fb50

          test "$(git hash-object assets/js/admin/admin-session-controller.js)" = "$expected_session"
          test "$(git hash-object assets/js/admin/admin-shell.js)" = "$expected_shell"
          test "$(git hash-object assets/js/dashboard/insights-controller.js)" = "$expected_insights"
          test "$(git hash-object assets/js/pages/dashboard-v2.js)" = "$expected_dashboard"

          node --check assets/js/admin/admin-session-controller.js
          node --check assets/js/admin/admin-shell.js
          node --check assets/js/dashboard/insights-controller.js
          node --check assets/js/pages/dashboard-v2.js

      - name: Commit exact fix and remove one-shot helper
        shell: bash
        run: |
          rm -f .github/workflows/p2k-v2112-homepage-fix-once.yml
          git config user.name "Ximoon1982"
          git config user.email "ximoon@gmail.com"
          git add assets/js/admin/admin-session-controller.js \
                  assets/js/admin/admin-shell.js \
                  assets/js/dashboard/insights-controller.js \
                  assets/js/pages/dashboard-v2.js \
                  .github/workflows/p2k-v2112-homepage-fix-once.yml
          git commit -m "Complete v2.11.2 homepage runtime dependency wiring"
          git push origin HEAD:release/v2.11.2
