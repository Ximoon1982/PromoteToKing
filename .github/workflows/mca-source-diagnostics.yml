name: MCA external discovery source diagnostics
on:
  push:
    paths:
      - '.github/workflows/mca-source-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose upcoming MCA page (direct HTML and JavaScript browser)
        shell: bash
        run: |
          python -m pip install -q requests beautifulsoup4 selenium
          mkdir -p dist
          cat > /tmp/mca_upcoming_probe.py <<'PY'
          import json,re,time,traceback,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          target='https://www.chess.com/clubs/upcomingevents/promote-to-king?type=multi-club-arena'
          urls=[target,'https://www.chess.com/clubs/upcomingevents/promote-to-king',
                'https://www.chess.com/clubs/events/promote-to-king']
          result={'direct':[],'browser':{},'scope':'public unauthenticated no writes'}
          def links(html):
              soup=BeautifulSoup(html,'html.parser')
              return [{'url':a.get('href','')[:300],'name':a.get_text(' ',strip=True)[:150]}
                      for a in soup.select('a[href]')
                      if re.search(r'(?:arena|/tournament/live/)',a.get('href',''),re.I)][:120]
          for u in urls:
              try:
                  r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'})
                  soup=BeautifulSoup(r.text,'html.parser')
                  result['direct'].append({'url':u,'http':r.status_code,'effective':r.url,'size':len(r.content),
                    'text':soup.get_text(' ',strip=True)[:1200],'links':links(r.text),
                    'scripts':[s.get('src','')[:200] for s in soup.select('script[src]')][:25],
                    'embedded_state':bool(soup.select_one('#__NEXT_DATA__')),
                    'arena_ids':list(dict.fromkeys(re.findall(r'/tournament/live/arena/[^" ]*?-(\d{7,9})',r.text)))[:70]})
                  if u==target:Path('dist/mca-upcoming-html.html').write_text(r.text[:500000])
              except Exception as e:result['direct'].append({'url':u,'error':str(e)})
          try:
              from selenium import webdriver
              from selenium.webdriver.chrome.options import Options
              opt=Options()
              for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1400,1100']:opt.add_argument(a)
              opt.set_capability('goog:loggingPrefs',{'performance':'ALL'})
              d=webdriver.Chrome(options=opt);d.set_page_load_timeout(40)
              d.execute_cdp_cmd('Network.enable',{})
              try:d.get(target)
              except Exception as e:result['browser']['navigate_warning']=str(e)[:250]
              for seconds in [4,8]:
                  time.sleep(seconds)
                  result['browser']['dom_'+str(seconds)]=d.execute_script("""
                  return {title:document.title,url:location.href,text:(document.body?.innerText||'').slice(0,4500),
                  links:[...document.querySelectorAll('a[href]')].map(a=>({url:a.href,name:(a.innerText||'').trim().slice(0,100)}))
                  .filter(a=>/arena|tournament|multi.club/i.test(a.url)).slice(0,120)}
                  """)
              networks=[]
              for x in d.get_log('performance'):
                  try:
                      e=json.loads(x['message'])['message']
                      if e['method']!='Network.responseReceived':continue
                      p=e['params'];r=p['response'];u=r.get('url','')
                      if 'chess.com' not in u and 'graphql' not in u:continue
                      item={'url':u[:350],'type':p.get('type'),'http':r.get('status'),'mime':r.get('mimeType')}
                      if p.get('type') in ('XHR','Fetch') and re.search('club|arena|event|tourna|graphql',u,re.I):
                          try:
                              payload=d.execute_cdp_cmd('Network.getResponseBody',{'requestId':p['requestId']})
                              body=payload.get('body','')
                              item['body_length']=len(body);item['body_preview']=body[:2000]
                              item['arena_links']=links(body)[:60]
                          except Exception as err:item['body_error']=str(err)[:120]
                      networks.append(item)
                  except Exception:pass
              result['browser']['network']=networks[:250]
              d.quit()
          except Exception as e:result['browser']['error']=repr(e);result['browser']['traceback']=traceback.format_exc()[-750:]
          Path('dist/mca-upcoming-probe.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print('UPCOMING_PROBE',json.dumps({
            'direct':[{'url':r.get('url'),'http':r.get('http'),'size':r.get('size'),'links':r.get('links',[])[:8],'error':r.get('error')} for r in result['direct']],
            'browser_error':result['browser'].get('error'),
            'browser_dom':result['browser'].get('dom_8',{}),
            'network':[{k:v for k,v in row.items() if k in ('url','type','http','mime','body_length','body_preview')} for row in result['browser'].get('network',[]) if row.get('type') in ('XHR','Fetch')][:24]
          },ensure_ascii=False))
          PY
          python /tmp/mca_upcoming_probe.py
      - name: Compare current failed and successful arena fetches (read-only)
        shell: bash
        run: |
          php <<'PHP'
          <?php
          require 'server/team-points/src/McaArenaParser.php';
          use P2K\TeamPoints\McaArenaParser;
          $arena=[
            'failed-31179196'=>'https://www.chess.com/tournament/live/arena/we-love-thursdays-5-0-2h-31179196',
            'worked-31176000'=>'https://www.chess.com/tournament/live/arena/we-love-wednesdays-3-0-2h-31176000',
          ];
          $agents=[
            'worker'=>'PromoteToKing/2.10.9.4 MCA Arena Acquisition (+https://www.promotetoking.org)',
            'browser'=>'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36',
          ];
          foreach($agents as $agent=>$ua) {
            foreach($arena as $name=>$base) {
              foreach(['clubs'=>'?clubs=1&players=1&pairings=1','csv'=>'/download-results'] as $kind=>$suffix) {
                $ch=curl_init($base.$suffix);
                curl_setopt_array($ch,[
                  CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_MAXREDIRS=>5,
                  CURLOPT_CONNECTTIMEOUT=>6,CURLOPT_TIMEOUT=>16,CURLOPT_USERAGENT=>$ua,CURLOPT_ENCODING=>'',
                  CURLOPT_HTTPHEADER=>['Accept: text/html,text/csv;q=0.9,*/*;q=0.5','Accept-Language: en-US,en;q=0.8'],
                ]);
                $raw=curl_exec($ch);
                $http=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
                $final=(string)curl_getinfo($ch,CURLINFO_EFFECTIVE_URL);
                $mime=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
                $err=curl_error($ch);
                curl_close($ch);
                $body=is_string($raw)?$raw:'';
                $out=['arena'=>$name,'agent'=>$agent,'type'=>$kind,'status'=>$http,
                  'length'=>strlen($body),'content_type'=>$mime,'final_url'=>$final,'error'=>$err,
                  'sha256'=>substr(hash('sha256',$body),0,20)];
                if($kind==='clubs'){
                  $a=stripos($body,'Club Results');
                  $b=$a===false?false:stripos($body,'Player Results',$a+12);
                  $section=$a===false?$body:($b===false?substr($body,$a):substr($body,$a,$b-$a));
                  $clubs=$http===200?McaArenaParser::clubRows($body):[];
                  $out+=['club_header_present'=>$a!==false,'body_tables'=>preg_match_all('~<tbody\b~i',$body),
                    'club_section_tables'=>preg_match_all('~<tbody\b~i',$section),
                    'club_href_matches'=>preg_match_all('~https?://www\.chess\.com/club/~i',$section),
                    'rank_markers'=>preg_match_all('~#\s*\d+~',$section),
                    'score_cell_markers'=>preg_match_all('~table-text-right~i',$section),
                    'parsed_clubs'=>count($clubs),
                    'first_club'=>$clubs[0]['club_slug']??null,
                    'section_prefix'=>substr(preg_replace('~\s+~',' ',strip_tags($section))??'',0,240)];
                }else{
                  $parsed=$http===200?McaArenaParser::resultsCsv($body):['clubs'=>[],'players'=>[]];
                  $out+=['csv_parsed_clubs'=>count($parsed['clubs']??[]),
                    'csv_parsed_players'=>count($parsed['players']??[]),
                    'csv_head'=>substr(preg_replace('/\s+/',' ',$body)??'',0,160)];
                }
                echo 'MCA_TARGET_DIAG ',json_encode($out,JSON_UNESCAPED_SLASHES|JSON_INVALID_UTF8_SUBSTITUTE),PHP_EOL;
                usleep(1100000);
              }
            }
          }
          PHP
      - name: Probe MCA page pagination and parse without touching live database
        shell: bash
        run: |
          mkdir -p /tmp/mca-diagnostics dist
          php <<'PHP' | tee dist/mca-source-diagnostics.txt
          <?php
          require 'server/team-points/src/McaIndexParser.php';
          require 'server/team-points/src/McaArenaParser.php';
          use P2K\TeamPoints\McaIndexParser;
          use P2K\TeamPoints\McaArenaParser;
          $urls=[
            'index1'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi',
            'index2'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi&page=2',
            'index3'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi&page=3',
            'bad-clubs'=>'https://www.chess.com/tournament/live/arena/one-world-league-6th-24-hours-multi-club-31111058?clubs=1&players=1&pairings=1',
          ];
          foreach(['worker'=>'PromoteToKing/2.10.9.4 MCA Arena Acquisition (+https://www.promotetoking.org)',
                   'browser'=>'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'] as $agent=>$ua){
            foreach($urls as $key=>$url){
              $ch=curl_init($url);
              curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_MAXREDIRS=>5,
                CURLOPT_CONNECTTIMEOUT=>6,CURLOPT_TIMEOUT=>15,CURLOPT_USERAGENT=>$ua,CURLOPT_ENCODING=>'',
                CURLOPT_HTTPHEADER=>['Accept: text/html,text/csv;q=0.9,*/*;q=0.5','Accept-Language: en-US,en;q=0.8']]);
              $html=curl_exec($ch);
              $status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
              $urlTo=(string)curl_getinfo($ch,CURLINFO_EFFECTIVE_URL);
              $curlerr=curl_error($ch);
              curl_close($ch);
              $html=is_string($html)?$html:'';
              $res=['ua'=>$agent,'source'=>$key,'status'=>$status,'effective_url'=>$urlTo,
                'length'=>strlen($html),'sha'=>substr(hash('sha256',$html),0,16),'curl_error'=>$curlerr];
              if(str_starts_with($key,'index') && $status===200){
                $p=McaIndexParser::parse($html,(int)substr($key,5));
                $ids=array_column($p['events'],'arena_id');
                $res+=['events'=>count($ids),'first'=>array_slice($ids,0,3),'last'=>array_slice($ids,-3),
                       'has_next'=>$p['has_next'],'fingerprint'=>hash('sha256',implode(',',$ids))];
              }elseif($key==='bad-clubs'&&$status===200){
                $res+=['clubs_parsed'=>count(McaArenaParser::clubRows($html)),
                  'html_tbody_count'=>substr_count(strtolower($html),'<tbody'),
                  'club_results_label'=>stripos($html,'Club Results')!==false];
              }
              if($status!==200)$res['start']=substr(preg_replace('/\s+/',' ',$html),0,140);
              echo json_encode($res,JSON_UNESCAPED_SLASHES|JSON_INVALID_UTF8_SUBSTITUTE),PHP_EOL;
              usleep(1000000);
            }
          }
          PHP
      - name: Extract failing HTML fixture and check full historical index coverage
        shell: bash
        run: |
          php <<'PHP'
          <?php
          require 'server/team-points/src/McaIndexParser.php';
          use P2K\TeamPoints\McaIndexParser;
          $get=static function(string $url):array {
            $ch=curl_init($url);
            curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,
              CURLOPT_CONNECTTIMEOUT=>6,CURLOPT_TIMEOUT=>15,CURLOPT_USERAGENT=>'PromoteToKing/2.10.9.4 MCA Arena Acquisition (+https://www.promotetoking.org)',
              CURLOPT_ENCODING=>'',CURLOPT_HTTPHEADER=>['Accept: text/html,text/csv;q=0.9,*/*;q=0.5','Accept-Language: en-US,en;q=0.8']]);
            $raw=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);$err=curl_error($ch);curl_close($ch);
            return [$status,is_string($raw)?$raw:'',$err];
          };
          [$status,$html,$err]=$get('https://www.chess.com/tournament/live/arena/one-world-league-6th-24-hours-multi-club-31111058?clubs=1&players=1&pairings=1');
          if($status===200){
            file_put_contents('dist/mca-bad-clubs.html',$html);
            $pos=stripos($html,'Club Results');if($pos===false)$pos=0;
            $fragment=substr($html,$pos,17000);
            $start=strpos($fragment,'<tbody');$firstrow=$start!==false?substr($fragment,$start,2800):substr($fragment,0,2800);
            echo 'CLUB TABLE FIRST ROW / STRUCTURE:',PHP_EOL,substr(preg_replace('/\\s+/', ' ',$firstrow),0,2800),PHP_EOL;
          }
          $unique=[];$lastSig='';$scan=[];
          for($page=1;$page<=40;$page++){
            $url='https://www.chess.com/club/live-tournaments/promote-to-king?type=multi'.($page>1?'&page='.$page:'');
            [$http,$body,$error]=$get($url);
            if($http!==200){echo "INDEX STOP: HTTP $http page $page $error\\n";break;}
            $p=McaIndexParser::parse($body,$page);$ids=array_column($p['events'],'arena_id');$sig=implode(',',$ids);
            if(!$ids){echo "INDEX STOP: empty page $page\\n";break;}
            if($sig===$lastSig){echo "INDEX STOP: repeated page $page\\n";break;}
            $lastSig=$sig;$prior=count($unique);
            foreach($p['events'] as $row)$unique[(int)$row['arena_id']]=$row;
            $scan[]=['page'=>$page,'count'=>count($ids),'new'=>count($unique)-$prior,'first'=>$ids[0],'last'=>$ids[count($ids)-1],'has_next'=>$p['has_next']];
            echo json_encode($scan[count($scan)-1]),PHP_EOL;
            if(count($ids)<25)break;
            usleep(1100000);
          }
          file_put_contents('dist/mca-index-scan.json',json_encode(['count'=>count($unique),'pages'=>$scan,'arenas'=>array_values($unique)],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
          echo 'INDEX UNIQUE ARENAS: ',count($unique),'; PAGES: ',count($scan),PHP_EOL;
          PHP
      - name: Export MCA source files for local regression testing
        shell: bash
        run: |
          zip -q -r dist/mca-dev-source.zip \
            server/team-points/src/McaResultsCronService.php \
            server/team-points/src/McaIndexParser.php \
            server/team-points/src/McaArenaParser.php \
            server/team-points/src/McaSourceCatalogue.php \
            server/team-points/src/LiveRanksService.php \
            assets/js/pages/team-points-features.js \
            TeamPointsAdmin.html \
            tests/test_v2109_mca_arena_acquisition.py \
            tests/test_v21091_mca_date_recovery.py \
            tests/test_v21092_mca_date_recovery.py \
            tests/test_v2130_mca_admin.py
      - uses: actions/upload-artifact@v4
        with:
          name: mca-source-diagnostics
          path: dist/mca-*
          retention-days: 3
