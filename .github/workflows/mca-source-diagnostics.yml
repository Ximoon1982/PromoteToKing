name: MCA external discovery source diagnostics
on:
  push:
    paths:
      - '.github/workflows/mca-source-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe MCA page pagination and parse without touching live database
        shell: bash
        run: |
          mkdir -p /tmp/mca-diagnostics dist
          php <<'PHP' | tee dist/mca-source-diagnostics.txt
          <?php
          require 'server/team-points/src/McaIndexParser.php';
          require 'server/team-points/src/McaArenaParser.php';
          use P2K\TeamPoints\McaIndexParser;
          use P2K\TeamPoints\McaArenaParser;
          $urls=[
            'index1'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi',
            'index2'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi&page=2',
            'index3'=>'https://www.chess.com/club/live-tournaments/promote-to-king?type=multi&page=3',
            'bad-clubs'=>'https://www.chess.com/tournament/live/arena/one-world-league-6th-24-hours-multi-club-31111058?clubs=1&players=1&pairings=1',
          ];
          foreach(['worker'=>'PromoteToKing/2.10.9.4 MCA Arena Acquisition (+https://www.promotetoking.org)',
                   'browser'=>'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'] as $agent=>$ua){
            foreach($urls as $key=>$url){
              $ch=curl_init($url);
              curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_MAXREDIRS=>5,
                CURLOPT_CONNECTTIMEOUT=>6,CURLOPT_TIMEOUT=>15,CURLOPT_USERAGENT=>$ua,CURLOPT_ENCODING=>'',
                CURLOPT_HTTPHEADER=>['Accept: text/html,text/csv;q=0.9,*/*;q=0.5','Accept-Language: en-US,en;q=0.8']]);
              $html=curl_exec($ch);
              $status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
              $urlTo=(string)curl_getinfo($ch,CURLINFO_EFFECTIVE_URL);
              $curlerr=curl_error($ch);
              curl_close($ch);
              $html=is_string($html)?$html:'';
              $res=['ua'=>$agent,'source'=>$key,'status'=>$status,'effective_url'=>$urlTo,
                'length'=>strlen($html),'sha'=>substr(hash('sha256',$html),0,16),'curl_error'=>$curlerr];
              if(str_starts_with($key,'index') && $status===200){
                $p=McaIndexParser::parse($html,(int)substr($key,5));
                $ids=array_column($p['events'],'arena_id');
                $res+=['events'=>count($ids),'first'=>array_slice($ids,0,3),'last'=>array_slice($ids,-3),
                       'has_next'=>$p['has_next'],'fingerprint'=>hash('sha256',implode(',',$ids))];
              }elseif($key==='bad-clubs'&&$status===200){
                $res+=['clubs_parsed'=>count(McaArenaParser::clubRows($html)),
                  'html_tbody_count'=>substr_count(strtolower($html),'<tbody'),
                  'club_results_label'=>stripos($html,'Club Results')!==false];
              }
              if($status!==200)$res['start']=substr(preg_replace('/\s+/',' ',$html),0,140);
              echo json_encode($res,JSON_UNESCAPED_SLASHES|JSON_INVALID_UTF8_SUBSTITUTE),PHP_EOL;
              usleep(1000000);
            }
          }
          PHP
      - name: Extract failing HTML fixture and check full historical index coverage
        shell: bash
        run: |
          php <<'PHP'
          <?php
          require 'server/team-points/src/McaIndexParser.php';
          use P2K\\TeamPoints\\McaIndexParser;
          $get=static function(string $url):array {
            $ch=curl_init($url);
            curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,
              CURLOPT_CONNECTTIMEOUT=>6,CURLOPT_TIMEOUT=>15,CURLOPT_USERAGENT=>'PromoteToKing/2.10.9.4 MCA Arena Acquisition (+https://www.promotetoking.org)',
              CURLOPT_ENCODING=>'',CURLOPT_HTTPHEADER=>['Accept: text/html,text/csv;q=0.9,*/*;q=0.5','Accept-Language: en-US,en;q=0.8']]);
            $raw=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);$err=curl_error($ch);curl_close($ch);
            return [$status,is_string($raw)?$raw:'',$err];
          };
          [$status,$html,$err]=$get('https://www.chess.com/tournament/live/arena/one-world-league-6th-24-hours-multi-club-31111058?clubs=1&players=1&pairings=1');
          if($status===200){
            file_put_contents('dist/mca-bad-clubs.html',$html);
            $pos=stripos($html,'Club Results');if($pos===false)$pos=0;
            $fragment=substr($html,$pos,17000);
            $start=strpos($fragment,'<tbody');$firstrow=$start!==false?substr($fragment,$start,2800):substr($fragment,0,2800);
            echo 'CLUB TABLE FIRST ROW / STRUCTURE:',PHP_EOL,substr(preg_replace('/\\s+/', ' ',$firstrow),0,2800),PHP_EOL;
          }
          $unique=[];$lastSig='';$scan=[];
          for($page=1;$page<=40;$page++){
            $url='https://www.chess.com/club/live-tournaments/promote-to-king?type=multi'.($page>1?'&page='.$page:'');
            [$http,$body,$error]=$get($url);
            if($http!==200){echo "INDEX STOP: HTTP $http page $page $error\\n";break;}
            $p=McaIndexParser::parse($body,$page);$ids=array_column($p['events'],'arena_id');$sig=implode(',',$ids);
            if(!$ids){echo "INDEX STOP: empty page $page\\n";break;}
            if($sig===$lastSig){echo "INDEX STOP: repeated page $page\\n";break;}
            $lastSig=$sig;$prior=count($unique);
            foreach($p['events'] as $row)$unique[(int)$row['arena_id']]=$row;
            $scan[]=['page'=>$page,'count'=>count($ids),'new'=>count($unique)-$prior,'first'=>$ids[0],'last'=>$ids[count($ids)-1],'has_next'=>$p['has_next']];
            echo json_encode($scan[count($scan)-1]),PHP_EOL;
            if(count($ids)<25)break;
            usleep(1100000);
          }
          file_put_contents('dist/mca-index-scan.json',json_encode(['count'=>count($unique),'pages'=>$scan,'arenas'=>array_values($unique)],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
          echo 'INDEX UNIQUE ARENAS: ',count($unique),'; PAGES: ',count($scan),PHP_EOL;
          PHP
      - uses: actions/upload-artifact@v4
        with:
          name: mca-source-diagnostics
          path: dist/mca-*
          retention-days: 3
