name: Repair Trophy r5fix3.10 observer interaction once

on:
  push:
    branches: [feature/trophy-gallery-poc]
    paths: [.github/workflows/trophy-r5310-observer-fix-once.yml]

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.event.head_commit.message == 'Stage r5fix3.10 observer interaction repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trophy-gallery-poc
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fa70e6bac64bd9892683dc0fab9f8f2ea4674e68"
          test "$(git branch --show-current)" = "feature/trophy-gallery-poc"
          test -z "$(git status --porcelain)"
      - name: Remove competing last-style behavior and rotate immutable r5fix3.10 identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          old_key = "r5310-924e1cb5d9a8"
          old_sha = "924e1cb5d9a8db8d05eece254fb4726bf77be57f96169d6ddb090cc44c63d306"
          expected_sha = "fd6d89209aa68e9e1cea3c47487fa8c4eb11fea275f8066ea5cb3075dcc0e8aa"
          runtime = Path("assets/js/admin/trophy-gallery-r5fix3.10.js")
          package = Path("tools/poc/trophy-gallery/r5fix3.10")
          packaged_js = package / "trophy-gallery-r5fix3.10.js"

          source = runtime.read_text(encoding="utf-8")
          old = '''function ensureStyle() {
            const head = document.head || document.documentElement;
            let style = document.getElementById(STYLE_ID);
            if (!style) {
              style = document.createElement('style');
              style.id = STYLE_ID;
              style.textContent = STYLE;
            }
            if (style.parentNode !== head || head.lastElementChild !== style) head.appendChild(style);
          }'''
          new = '''function ensureStyle() {
            const head = document.head || document.documentElement;
            let style = document.getElementById(STYLE_ID);
            if (!style) {
              style = document.createElement('style');
              style.id = STYLE_ID;
              style.textContent = STYLE;
              head.appendChild(style);
              return;
            }
            if (style.parentNode !== head) head.appendChild(style);
          }'''
          if source.count(old) != 1:
              raise SystemExit("r5fix3.10 ensureStyle target not found exactly once")
          source = source.replace(old, new, 1)
          runtime.write_text(source, encoding="utf-8")
          packaged_js.write_bytes(runtime.read_bytes())

          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f"Unexpected corrected r5fix3.10 digest: {digest}")
          key = "r5310-" + digest[:12]
          print("Corrected r5fix3.10 key:", key)

          installer = package / "install-trophy-gallery-r5fix3.10.sh"
          text = installer.read_text(encoding="utf-8")
          if text.count(old_key) != 1 or text.count(old_sha) != 1:
              raise SystemExit("Installer old identity not found exactly once")
          text = text.replace(old_key, key, 1).replace(old_sha, digest, 1)
          installer.write_text(text, encoding="utf-8")

          identity_files = {
              Path("ui-v2.html"): 1,
              Path("trophies/index.html"): 1,
              Path("tests/browser_gate_trophy_gallery_preview_containment.py"): 1,
              Path("tests/browser_gate_trophy_gallery_overlay.py"): 1,
          }
          for path, count in identity_files.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old_key) != count:
                  raise SystemExit(f"{path}: expected {count} old identity reference(s), found {text.count(old_key)}")
              path.write_text(text.replace(old_key, key), encoding="utf-8")

          contract = Path("tests/test_trophy_gallery_r5fix310.py")
          text = contract.read_text(encoding="utf-8")
          marker = "def test_r5fix310_does_not_compete_for_last_head_style():"
          if marker not in text:
              text += '''\n\ndef test_r5fix310_does_not_compete_for_last_head_style():\n    js = PATCH.read_text(encoding="utf-8")\n    assert "head.lastElementChild" not in js\n    assert "style.parentNode !== head" in js\n'''
              contract.write_text(text, encoding="utf-8")

          manifest = package / "MANIFEST.sha256"
          names = ["README.txt", "install-trophy-gallery-r5fix3.10.sh", "patch-loaders.py", "trophy-gallery-r5fix3.10.js"]
          manifest.write_text("".join(f"{hashlib.sha256((package/name).read_bytes()).hexdigest()}  {name}\n" for name in names), encoding="utf-8")

          assert packaged_js.read_bytes() == runtime.read_bytes()
          assert "head.lastElementChild" not in source
          assert key == "r5310-fd6d89209aa6"
          PY
          chmod +x tools/poc/trophy-gallery/r5fix3.10/install-trophy-gallery-r5fix3.10.sh tools/poc/trophy-gallery/r5fix3.10/patch-loaders.py
      - name: Install browser regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - name: Validate corrected r5fix3.10 runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/admin/trophy-gallery-r5fix3.10.js
          bash -n tools/poc/trophy-gallery/r5fix3.10/install-trophy-gallery-r5fix3.10.sh
          python -m pytest -q tests/test_trophy_gallery_poc.py tests/test_trophy_gallery_r5.py tests/test_trophy_gallery_media_lifecycle.py tests/test_trophy_gallery_r5fix310.py
          python tests/browser_gate_trophy_gallery_poc.py
          python tests/browser_gate_trophy_gallery_preview_containment.py
          python tests/browser_gate_trophy_gallery_overlay.py
          bash tools/poc/trophy-gallery/r5fix3.10/install-trophy-gallery-r5fix3.10.sh "$GITHUB_WORKSPACE" verify
          test "$(sha256sum assets/js/admin/trophy-gallery-r5fix3.10.js | cut -d' ' -f1)" = "fd6d89209aa68e9e1cea3c47487fa8c4eb11fea275f8066ea5cb3075dcc0e8aa"
          grep -Fq 'r5310-fd6d89209aa6' ui-v2.html
          grep -Fq 'r5310-fd6d89209aa6' trophies/index.html
          ! grep -R -F -q --exclude='trophy-gallery-poc.yml' --exclude='trophy-r5310-observer-fix-once.yml' 'r5310-924e1cb5d9a8' assets tests tools ui-v2.html trophies/index.html
      - name: Commit corrected source without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/trophy-r5310-observer-fix-once.yml
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'Ximoon1982'
          git config user.email 'ximoon@gmail.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Fix r5fix3.10 observer interaction'
          git push origin HEAD:feature/trophy-gallery-poc
