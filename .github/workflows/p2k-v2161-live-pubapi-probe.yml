name: P2K 2.16.1 - live PubAPI read-only diagnosis
on:
  push:
    branches: [release/v2.16.1]
    paths:
      - 'tests/p2k_v2161_live_pubapi_probe.py'
      - '.github/workflows/p2k-v2161-live-pubapi-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual Team France club index and Live/Daily match endpoints
        run: python3 tests/p2k_v2161_live_pubapi_probe.py
