name: P2K v2.12.2 connector handoff

on:
  push:
    branches: [release/v2.12.2]

permissions:
  contents: write

jobs:
  apply-verified-overlay:
    if: github.event.head_commit.message == 'Bootstrap v2.12.2 connector handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact verified overlay
        run: |
          set -euo pipefail
          cat .p2k-handoff/chunk-* | base64 -d >/tmp/p2k-v2122-final-overlay.tgz
          printf '%s  %s\n' '4cbd2a3598f0bf9ee6ccbb87ce4700be381cddd5acfff52c3fb35e5deb4ac1b6' /tmp/p2k-v2122-final-overlay.tgz | sha256sum -c -
          tar -xzf /tmp/p2k-v2122-final-overlay.tgz -C .
          rm -rf .p2k-handoff
          # Workflow files are finalized by the connected GitHub transport after
          # this source commit, because GITHUB_TOKEN cannot modify workflow files.
          rm -f .github/workflows/p2k-v2122-qualification.yml

      - name: Focused pre-commit validation
        run: |
          set -euo pipefail
          php -l server/events-showcase/src/EventsShowcaseStore.php
          php -l server/events-showcase/public/api.php
          php -l server/events-showcase/public/embed.php
          node --check assets/js/shared/recruitment-lineup-core.js
          node --check assets/js/shared/events-showcase-core.js
          node --check assets/js/admin/events-showcase-v2122.js
          node --check assets/js/admin/trophy-card-presentation-v2122.js
          node --check assets/js/admin/tool-registry.js
          php tests/test_events_showcase_store.php
          node tests/test_recruitment_lineup_parity.js
          python3 tests/test_events_showcase_contract.py
          bash -n tools/release/v2122/build-package.sh
          bash -n tools/release/v2122/install-promote-to-king-v2.12.2.sh
          bash -n tools/release/v2122/qualify-installer.sh
          python3 -m py_compile \
            tools/release/v2122/production_paths.py \
            tools/release/v2122/stamp_asset_cache_key.py \
            tests/browser_gate_v2122.py
          python3 -m json.tool site-manifest.json >/dev/null
          git diff --check

      - name: Commit verified source overlay
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Integrate v2.12.2 Events Showcase and Trophy card presentation"
          git push origin HEAD:release/v2.12.2
