name: P2K v2.11.2 full regression gate

on:
  push:
    branches: [release/v2.11.2]
  pull_request:
    branches: [release/v2.11.2]
  workflow_dispatch:

# Final exact-head qualification trigger after homepage runtime dependency restoration.
permissions:
  contents: read

jobs:
  audit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - run: python tools/test-suite/structural_parity.py
      - run: python tools/test-suite/architecture_gate.py
      - run: python tools/test-suite/p2k_test_suite.py audit --json
      - run: python tools/test-suite/p2k_test_suite.py regression

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: audit-and-regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - run: python tools/test-suite/p2k_test_suite.py browser

  package-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [audit-and-regression, browser-regression]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Build checksummed source and installer artifacts
        run: bash tools/release/build-v2112-structural-package.sh "$RUNNER_TEMP/v2112-build"
      - name: Run canonical regression suite against unpacked source artifact
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/v2112-build/PromoteToKing-v2.11.2-source.zip" -d "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          python tools/test-suite/p2k_test_suite.py regression
      - name: Verify first install, idempotent reinstall, rollback, manifest and checksums
        run: bash tools/release/qualify-v2112-installer.sh "$RUNNER_TEMP/v2112-build"
      - uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.11.2-qualified
          path: |
            ${{ runner.temp }}/v2112-build/PromoteToKing-v2.11.2-source.zip
            ${{ runner.temp }}/v2112-build/PromoteToKing_v2.11.2_STRUCTURAL_CONSOLIDATION.run
            ${{ runner.temp }}/v2112-build/install-promote-to-king-2.11.2.sh
            ${{ runner.temp }}/v2112-build/INSTALL_v2.11.2.txt
            ${{ runner.temp }}/v2112-build/SHA256SUMS_v2.11.2.txt
