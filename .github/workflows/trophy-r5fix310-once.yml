name: Stage Trophy r5fix3.10 preview repair once

on:
  push:
    branches: [feature/trophy-gallery-poc]
    paths: [.github/workflows/trophy-r5fix310-once.yml]

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.event.head_commit.message == 'Stage Trophy r5fix3.10 preview repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trophy-gallery-poc
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact recovery base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4770a2638feb23012ac6239ebbbbc3709dc05eb"
          test "$(git branch --show-current)" = "feature/trophy-gallery-poc"
          test -z "$(git status --porcelain)"
      - name: Apply exact locally-qualified r5fix3.10 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r5310-patch-{01..06}.part > /tmp/r5310.patch
          echo '9752ca0b85a151db70a43c94912e461d0dbded8c2dbabc77425acf72a8deb5a2  /tmp/r5310.patch' | sha256sum -c -
          patch -p1 < /tmp/r5310.patch
          chmod +x tools/poc/trophy-gallery/r5fix3.10/install-trophy-gallery-r5fix3.10.sh tools/poc/trophy-gallery/r5fix3.10/patch-loaders.py
          rm -f .github/r5310-patch-{01..06}.part .github/workflows/p2k-source-recovery-once.yml
      - name: Restore approved 2.11.5 identity and isolate containment fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = b"2.11.5-b9e1090f10b9d"
          new = b"2.11.5-bf6a828490f57"
          expected = {
              ".github/workflows/trophy-gallery-poc.yml",
              "AnalyzeMatch.html",
              "AnalyzeMatchModal.html",
              "AnalyzeMatches.htm",
              "ChallengeListAssistant.html",
              "ClubIntelligence.html",
              "DataReconciliation.html",
              "FindMatch.htm",
              "InsightsHealth.html",
              "LeagueSeasonCenter.html",
              "LiveRanks.html",
              "MatchCreationAnalyzer.htm",
              "MigrationInstaller.html",
              "Opponents.html",
              "RecruitMatch.html",
              "RecruitmentAdmin.html",
              "RecruitmentDemandPlanner.html",
              "TaskControl.html",
              "TaskLogs.html",
              "TeamInsights.html",
              "TeamPointsAdmin.html",
              "TeamPointsMigration.html",
              "TournamentAchievementBadgesDemo.html",
              "TournamentManagement.html",
              "Tournaments.html",
              "assets/js/dashboard/insights-controller.js",
              "assets/js/pages/dashboard-insights.js",
              "assets/js/pages/dashboard-v2.js",
              "assets/js/pages/members-insights-enhancement.js",
              "assets/js/shared/analytics.js",
              "assets/js/site-config.js",
              "index.html",
              "tests/browser_gate_trophy_gallery_overlay.py",
              "ui-v2.html",
          }
          found = set()
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if old in data:
                  found.add(path.as_posix().lstrip("./"))
          if found != expected:
              raise SystemExit(
                  "Unexpected b9e109 identity surface.\nMissing: " + str(sorted(expected - found)) +
                  "\nExtra: " + str(sorted(found - expected))
              )
          substitutions = 0
          for rel in sorted(found):
              path = Path(rel)
              data = path.read_bytes()
              substitutions += data.count(old)
              path.write_bytes(data.replace(old, new))
          print(f"Restored approved bf6a identity in {len(found)} files / {substitutions} references")

          stale = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  if old in path.read_bytes():
                      stale.append(path.as_posix())
              except OSError:
                  pass
          if stale:
              raise SystemExit("Stale b9e109 identity remains: " + ", ".join(stale))
          PY

          cat > tests/browser_gate_trophy_gallery_preview_containment.py <<'PYTEST'
          #!/usr/bin/env python3
          """Browser regression for Trophy Gallery admin image-preview containment."""
          from __future__ import annotations

          import json
          import os
          import shutil
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          ROOT = Path(__file__).resolve().parents[1]
          CHROMIUM = os.environ.get("P2K_CHROMIUM") or shutil.which("chromium") or shutil.which("google-chrome") or shutil.which("google-chrome-stable") or "/usr/bin/chromium"
          R5310_JS = "r5310-924e1cb5d9a8"
          R5310_PATH = ROOT / "assets/js/admin/trophy-gallery-r5fix3.10.js"


          def main() -> None:
              if not Path(CHROMIUM).exists():
                  raise RuntimeError("Chromium is required for the Trophy preview containment gate")

              errors: list[str] = []
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(
                      headless=True,
                      executable_path=CHROMIUM,
                      args=["--no-sandbox", "--disable-dev-shm-usage"],
                  )
                  page = browser.new_page(viewport={"width": 1280, "height": 900})
                  page.on("pageerror", lambda error: errors.append(error.stack or str(error)))

                  page.set_content(
                      """
                      <!doctype html>
                      <html><head><meta charset="utf-8"></head><body>
                        <main id="adminShellNativeDetailHost" data-native-detail="trophy-gallery"></main>
                      </body></html>
                      """,
                      wait_until="domcontentloaded",
                  )
                  page.add_script_tag(path=str(R5310_PATH))
                  page.wait_for_function("window.__P2K_TROPHY_R5FIX3_10 === true", timeout=5000)

                  page.evaluate(
                      """() => {
                        const host = document.querySelector('#adminShellNativeDetailHost');
                        host.innerHTML = `
                          <form class="p2k-trophy-form">
                            <section class="p2k-media-card">
                              <strong>Vignette image</strong>
                              <button type="button" class="p2k-media-preview" data-preview="vignette">
                                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
                              </button>
                            </section>
                          </form>`;
                      }"""
                  )

                  host = "#adminShellNativeDetailHost"
                  page.wait_for_function(
                      """document.querySelector("#adminShellNativeDetailHost [data-preview='vignette']")?.dataset.r5310Contained === '1'""",
                      timeout=5000,
                  )

                  page.evaluate(
                      """() => {
                          const style = document.createElement('style');
                          style.id = 'preview-escape-regression';
                          style.textContent = `
                            #adminShellNativeDetailHost .p2k-media-preview { height:100vh!important; overflow:visible!important; }
                            #adminShellNativeDetailHost .p2k-media-preview img { position:fixed!important; inset:0!important; width:100vw!important; height:100vh!important; max-width:none!important; max-height:none!important; }
                          `;
                          document.head.appendChild(style);
                      }"""
                  )

                  page.wait_for_function(
                      """() => {
                        const p = document.querySelector("#adminShellNativeDetailHost [data-preview='vignette']");
                        const i = p?.querySelector('img');
                        return p && i
                          && getComputedStyle(p).height === '280px'
                          && getComputedStyle(p).overflow === 'hidden'
                          && getComputedStyle(i).position === 'absolute'
                          && getComputedStyle(i).objectFit === 'contain';
                      }""",
                      timeout=5000,
                  )

                  preview = page.locator(f"{host} [data-preview='vignette']")
                  image = preview.locator("img")
                  preview_box = preview.bounding_box()
                  image_box = image.bounding_box()
                  assert preview_box is not None and image_box is not None
                  assert 279 <= preview_box["height"] <= 281, preview_box
                  assert preview.evaluate("el => getComputedStyle(el).overflow") == "hidden"
                  assert image.evaluate("el => getComputedStyle(el).position") == "absolute"
                  assert image.evaluate("el => getComputedStyle(el).objectFit") == "contain"
                  assert image_box["x"] >= preview_box["x"] - 1
                  assert image_box["y"] >= preview_box["y"] - 1
                  assert image_box["x"] + image_box["width"] <= preview_box["x"] + preview_box["width"] + 1
                  assert image_box["y"] + image_box["height"] <= preview_box["y"] + preview_box["height"] + 1
                  assert page.locator("#p2kTrophyR5Fix310Style").count() == 1
                  assert not errors, errors
                  browser.close()

              print(json.dumps({
                  "trophy_gallery_admin_preview_containment": "passed",
                  "r5fix3_10_js_key": R5310_JS,
                  "height_px": preview_box["height"],
                  "position": "absolute",
                  "overflow": "hidden",
                  "errors": errors,
              }, indent=2))


          if __name__ == "__main__":
              main()
          PYTEST

          python -m py_compile tests/browser_gate_trophy_gallery_preview_containment.py
          grep -Fq '2.11.5-bf6a828490f57' assets/js/site-config.js
          ! grep -R -F -q --exclude-dir=.git '2.11.5-b9e1090f10b9d' .
      - name: Install regression dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - name: Validate r5fix3.10 contract and reported browser failure
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/admin/trophy-gallery-r5fix3.10.js
          bash -n tools/poc/trophy-gallery/r5fix3.10/install-trophy-gallery-r5fix3.10.sh
          python -m py_compile tests/browser_gate_trophy_gallery_overlay.py tests/browser_gate_trophy_gallery_preview_containment.py tools/poc/trophy-gallery/r5fix3.10/patch-loaders.py
          python -m pytest -q tests/test_trophy_gallery_poc.py tests/test_trophy_gallery_r5.py tests/test_trophy_gallery_media_lifecycle.py tests/test_trophy_gallery_r5fix310.py
          python tests/browser_gate_trophy_gallery_preview_containment.py
          test "$(cat VERSION)" = "2.11.5"
          grep -Fq '2.11.5-bf6a828490f57' assets/js/site-config.js
          grep -Fq 'r538-d52193a71712' ui-v2.html
          grep -Fq 'r538-fdcea54d62ba' ui-v2.html
          grep -Fq 'r5310-924e1cb5d9a8' ui-v2.html
      - name: Commit verified r5fix3.10 repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/trophy-r5fix310-once.yml
          git config user.name 'Ximoon1982'
          git config user.email 'ximoon@gmail.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Fix Trophy admin preview containment (r5fix3.10)'
          git push origin HEAD:feature/trophy-gallery-poc
