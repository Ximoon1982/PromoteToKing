name: P2K v2.14.3 package

on:
  push:
    branches: [release/v2.14.3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build exact universal incremental installer
        run: |
          bash tools/release/v2143/build-universal-2.13x.sh "$RUNNER_TEMP/v2143"
          unzip -t "$RUNNER_TEMP/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x.zip"
          test -s "$RUNNER_TEMP/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/CANDIDATE_RELEASE.json"
          test -s "$RUNNER_TEMP/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/CANDIDATE_PAYLOAD.sha256"
          test -x "$RUNNER_TEMP/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/prepare-candidate-preview-v2.14.3.sh"
          sha256sum "$RUNNER_TEMP/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.14.3-universal-${{ github.sha }}
          path: ${{ runner.temp }}/v2143/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x.zip
          if-no-files-found: error
          retention-days: 30
