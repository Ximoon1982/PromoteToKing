name: One-shot Showcase admin reconciliation

on:
  push:
    branches:
      - release/v2.12.2

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Load exact production Showcase admin source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.12.2
          fetch-depth: 0
      - name: Restore exact validated production admin source
        shell: bash
        run: |
          cat > /tmp/prod-admin.js.gz.b64 <<'B64'

B64
          base64 -d /tmp/prod-admin.js.gz.b64 | gzip -d > /tmp/prod-admin.js
          EXPECTED=fdd945173e396e008e2d85c4ed7249bf70bedc3cab7548fa0e98b09f51bcbb44
          ACTUAL="$(sha256sum /tmp/prod-admin.js | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          cp /tmp/prod-admin.js assets/js/admin/events-showcase-v2122.js
          test "$(sha256sum assets/js/admin/events-showcase-v2122.js | awk '{print $1}')" = "$EXPECTED"
          node --check assets/js/admin/events-showcase-v2122.js
      - name: Commit reconciled source
        shell: bash
        run: |
          git config user.name "P2K qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/admin/events-showcase-v2122.js
          if git diff --cached --quiet; then
            echo "Admin source already matches production."
            exit 0
          fi
          git commit -m "Reconcile Showcase admin with production"
          git push origin HEAD:release/v2.12.2
