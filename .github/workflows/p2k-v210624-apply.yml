name: P2K v2.10.9 exact generator

on:
  push:
    branches:
      - next/v2.10.6.24
    paths:
      - .p2k/v2109-gen/RUN

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and hash-verify exact missing files
        shell: bash
        run: |
          set -euo pipefail
          python3 .p2k/v2109-gen/build.py

      - name: Commit exact generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P2K Release Automation"
          git config user.email "p2k-release@users.noreply.github.com"
          git add -- \
            CHANGELOG.md \
            PromoteToKing_v2.10.9_INCREMENTAL_INSTALLER.run \
            SOURCE_MANIFEST_v2.10.8.json \
            assets/js/pages/dashboard-v2.js \
            server/team-points/src/Repository.php
          git diff --cached --quiet && { echo "No generated source changes staged" >&2; exit 1; }
          git commit -m "stage: exact Promote to King v2.10.9 generated files"
          git push origin HEAD:next/v2.10.6.24
