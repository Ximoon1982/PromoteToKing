name: P2K v2.10.9 exact generator

on:
  push:
    branches:
      - next/v2.10.6.24
    paths:
      - .p2k/v2109-gen/RUN

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate files with diagnostic manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.p2k/v2109-gen/build.py')
          s=p.read_text()
          s=s.replace("if hashlib.sha256(mp.read_bytes()).hexdigest()!='8a8ff3a2ce09cb9456c645c73c75420cf25821eeb9c8ab412abed920fd0b1c4a': raise SystemExit('source manifest sha mismatch')", "print('generated source manifest sha', hashlib.sha256(mp.read_bytes()).hexdigest())")
          s=s.replace("check('SOURCE_MANIFEST_v2.10.8.json','dea2f2c1920533198f3ac720f5aafcc63ba55928')", "print('generated source manifest blob', blob('SOURCE_MANIFEST_v2.10.8.json'))")
          p.write_text(s)
          PY
          python3 .p2k/v2109-gen/build.py

      - name: Commit diagnostic generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P2K Release Automation"
          git config user.email "p2k-release@users.noreply.github.com"
          git add -- \
            CHANGELOG.md \
            PromoteToKing_v2.10.9_INCREMENTAL_INSTALLER.run \
            SOURCE_MANIFEST_v2.10.8.json \
            assets/js/pages/dashboard-v2.js \
            server/team-points/src/Repository.php
          git diff --cached --quiet && { echo "No generated source changes staged" >&2; exit 1; }
          git commit -m "stage: v2.10.9 exact files plus manifest diagnostic"
          git push origin HEAD:next/v2.10.6.24
