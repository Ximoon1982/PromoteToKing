name: P2K v2.11.1 full regression gate

on:
  push:
    branches: [release/v2.11.1]
  pull_request:
    branches: [main, release/v2.11.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - run: python tools/test-suite/production_parity.py
      - run: python tools/test-suite/p2k_test_suite.py audit --json
      - run: python tools/test-suite/p2k_test_suite.py regression

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: audit-and-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - run: python tools/test-suite/p2k_test_suite.py browser

  package-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [audit-and-regression, browser-regression]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Build checksummed source and installer artifacts
        run: bash tools/release/build-v2111-auth-package.sh "$RUNNER_TEMP/v2111-build"
      - name: Run canonical regression suite against unpacked source artifact
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/v2111-build/PromoteToKing-v2.11.1-source.zip" -d "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          python tests/validate_package.py
          python tools/test-suite/p2k_test_suite.py regression
      - name: Verify first install, idempotent reinstall, rollback, manifest and checksums
        run: |
          BUILD="$RUNNER_TEMP/v2111-build"
          TARGET="$RUNNER_TEMP/r6-target"
          ROLLBACK="$RUNNER_TEMP/r6-rollback"
          mkdir "$TARGET" "$ROLLBACK"
          git archive 93480c852fc4c554c9a404e5d68b0ac51efed04b | tar -x -C "$TARGET"
          git archive 93480c852fc4c554c9a404e5d68b0ac51efed04b | tar -x -C "$ROLLBACK"
          "$BUILD/PromoteToKing_v2.11.1_AUTH_SESSION_HARDENING.run" "$TARGET"
          diff -u server/team-points/src/OAuthSession.php "$TARGET/server/team-points/src/OAuthSession.php"
          (cd "$TARGET" && sha256sum -c MANIFEST.sha256)
          sha256sum "$TARGET/server/team-points/src/OAuthSession.php" > "$RUNNER_TEMP/before-reinstall.sha"
          "$BUILD/PromoteToKing_v2.11.1_AUTH_SESSION_HARDENING.run" "$TARGET"
          sha256sum "$TARGET/server/team-points/src/OAuthSession.php" > "$RUNNER_TEMP/after-reinstall.sha"
          diff -u "$RUNNER_TEMP/before-reinstall.sha" "$RUNNER_TEMP/after-reinstall.sha"
          sha256sum "$ROLLBACK/server/team-points/src/OAuthSession.php" > "$RUNNER_TEMP/rollback-before.sha"
          if P2K_FORCE_INSTALL_FAILURE=1 "$BUILD/PromoteToKing_v2.11.1_AUTH_SESSION_HARDENING.run" "$ROLLBACK"; then exit 1; fi
          sha256sum "$ROLLBACK/server/team-points/src/OAuthSession.php" > "$RUNNER_TEMP/rollback-after.sha"
          diff -u "$RUNNER_TEMP/rollback-before.sha" "$RUNNER_TEMP/rollback-after.sha"
          (cd "$BUILD" && sha256sum -c SHA256SUMS_v2.11.1.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.11.1-qualified
          path: |
            ${{ runner.temp }}/v2111-build/PromoteToKing-v2.11.1-source.zip
            ${{ runner.temp }}/v2111-build/PromoteToKing_v2.11.1_AUTH_SESSION_HARDENING.run
            ${{ runner.temp }}/v2111-build/SHA256SUMS_v2.11.1.txt
