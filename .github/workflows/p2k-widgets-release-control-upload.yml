name: P2K Widgets v2.15.3 + Members CSV Release Control direct-upload package
on:
  push:
    paths:
      - '.github/workflows/p2k-widgets-release-control-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-baseline Release Control web-upload ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          R=pathlib.Path(".")
          out=pathlib.Path("dist")
          out.mkdir(exist_ok=True)
          pkg=out/"P2K_Team_Widgets_Members_CSV_v2153_ReleaseControl_Upload"
          payload=pkg/"payload"
          payload.mkdir(parents=True)
          candidate_version="2.15.3"
          source_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          accepted=[{"version":"2.15.2","source_head":"ed6e0a80774d3be1e7925d4385d458a0b2e25432"}]
          app_paths=[
            "VERSION","ui-v2.html",
            "assets/js/admin/admin-shell.js",
            "assets/js/admin/events-showcase-v2122.js",
            "assets/js/admin/tool-registry.js",
            "assets/js/admin/widgets-v2153.js",
            "assets/js/widgets/p2k-embed-v2153.js",
            "assets/css/widgets/p2k-embed-v2153.css",
            "server/widgets/src/WidgetConfigStore.php",
            "server/widgets/public/api.php",
            "server/widgets/public/embed.php",
            "server/team-points/public/members-insights-export.php",
          ]
          recovery_paths=[
            "ReleaseControl.php",
            "server/release-control/src/bootstrap.php",
            "server/release-control/src/ReleasePackageUploadInstaller.php",
            "server/release-control/src/FilesystemCleanupManager.php",
          ]
          for path in app_paths+recovery_paths:
            file=R/path
            if not file.is_file():raise RuntimeError(f"Missing source: {path}")
            dest=payload/path
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(file.read_bytes())
          (payload/"VERSION").write_text(candidate_version+"\n")
          cache_key="p2k-"+candidate_version+"-"+source_head[:12]+"-"+hashlib.sha256((source_head+"|p2k-widget-collection-v2153").encode()).hexdigest()[:16]
          ui=(payload/"ui-v2.html").read_text()
          import re
          ui=re.sub(r"p2k-\d+\.\d+\.\d+-[a-f0-9]{12}-[a-f0-9]{16}",cache_key,ui,flags=re.I)
          ui=ui.replace("p2k-2.15.3-widgets-20261111",cache_key)
          if "</head>" not in ui:raise RuntimeError("Missing UI </head>")
          ui=ui.replace("</head>",f'<meta name="p2k-build" content="{cache_key}">\n</head>',1)
          (payload/"ui-v2.html").write_text(ui)
          digest=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          man="".join(digest(payload/path)+"  ./"+path+"\n" for path in sorted(app_paths))
          (pkg/"CANDIDATE_PAYLOAD.sha256").write_text(man)
          rec="".join(digest(payload/path)+"  ./"+path+"\n" for path in sorted(recovery_paths))
          (pkg/"RECOVERY_PLANE.sha256").write_text(rec)
          metadata={"schema_version":1,"version":candidate_version,"source_head":source_head,
              "cache_key":cache_key,"build_id":"p2k-widgets-v2153-"+source_head[:12]+"-web-upload",
              "payload_manifest_sha256":digest(pkg/"CANDIDATE_PAYLOAD.sha256"),
              "accepted_public_builds":accepted}
          (pkg/"CANDIDATE_RELEASE.json").write_text(json.dumps(metadata,indent=2)+"\n")
          (pkg/"README.txt").write_text("Upload this ZIP directly in P2K Release Control > Upload release ZIP.\n"
              "No SSH commands. This is a strict 2.15.2-ed6e0a80774d base candidate for v2.15.3.\n"
              "Upload prepares a candidate and preview only. It does not promote.\n"
              "Includes the four mandatory existing recovery-plane files, unchanged from repository.\n"
              "No database migration or change to persisted Match Showcase state.\n")
          zip_dest=out/"P2K_Team_Widgets_Members_CSV_v2153_ReleaseControl_Upload.zip"
          with zipfile.ZipFile(zip_dest,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for file in pkg.rglob("*"):
              if file.is_file():z.write(file,file.relative_to(pkg))
          with zipfile.ZipFile(zip_dest) as z:
            assert z.testzip() is None
            assert "CANDIDATE_RELEASE.json" in z.namelist()
            assert "RECOVERY_PLANE.sha256" in z.namelist()
            assert "CANDIDATE_PAYLOAD.sha256" in z.namelist()
            assert len(z.namelist())==20
          print("Candidate ZIP:",zip_dest)
          print("Accepted public build:",accepted)
          print("Stamped cache key:",cache_key)
          print("SHA256:",digest(zip_dest))
          PY
      - name: Validate with the real ReleaseCandidatePackage contract
        shell: bash
        run: |
          php -r 'require "server/release-control/src/ReleaseSlotPolicy.php"; require "server/release-control/src/ReleaseCandidatePackage.php"; $p=(new P2K\ReleaseControl\ReleaseCandidatePackage("dist/P2K_Team_Widgets_Members_CSV_v2153_ReleaseControl_Upload"))->validate(); if($p["version"]!=="2.15.3" || $p["overlay_file_count"]!==12) exit(1); echo "Candidate contract OK: ".$p["release_id"].PHP_EOL;'
          for f in server/widgets/src/WidgetConfigStore.php server/widgets/public/api.php server/widgets/public/embed.php; do php -l "$f"; done
          php -l ReleaseControl.php
          php -l server/team-points/public/members-insights-export.php
          python3 -m pytest -q tests/test_v2153_members_csv_period.py tests/test_v2150_members_csv_resource_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-widgets-v2153-release-control-direct-upload
          path: dist/P2K_Team_Widgets_Members_CSV_v2153_ReleaseControl_Upload.zip
          retention-days: 7
