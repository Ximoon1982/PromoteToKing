name: P2K MCA v2.15.4 Release Control direct-upload package
on:
  push:
    paths:
      - '.github/workflows/p2k-mca-v2154-release-control-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-baseline Release Control web-upload ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          R=pathlib.Path(".")
          out=pathlib.Path("dist")
          out.mkdir(exist_ok=True)
          pkg=out/"P2K_MCA_Recovery_v2154_ReleaseControl_Upload"
          payload=pkg/"payload"
          payload.mkdir(parents=True)
          candidate_version="2.15.4"
          source_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          accepted=[{"version":"2.15.3","source_head":"b60ddb03b95c93a16dbae5274998850183fe26c9"}]
          app_paths=[
            "VERSION","ui-v2.html","TeamPointsAdmin.html",
            "assets/js/pages/team-points-features.js",
            "server/team-points/src/McaArenaParser.php",
            "server/team-points/src/McaResultsCronService.php",
          ]
          recovery_paths=[
            "ReleaseControl.php",
            "server/release-control/src/bootstrap.php",
            "server/release-control/src/ReleasePackageUploadInstaller.php",
            "server/release-control/src/FilesystemCleanupManager.php",
          ]
          for path in app_paths+recovery_paths:
            file=R/path
            if not file.is_file():raise RuntimeError(f"Missing source: {path}")
            dest=payload/path
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(file.read_bytes())
          (payload/"VERSION").write_text(candidate_version+"\n")
          cache_key="p2k-"+candidate_version+"-"+source_head[:12]+"-"+hashlib.sha256((source_head+"|p2k-mca-recovery-v2154").encode()).hexdigest()[:16]
          ui=(payload/"ui-v2.html").read_text()
          import re
          ui=re.sub(r"p2k-\d+\.\d+\.\d+-[a-f0-9]{12}-[a-f0-9]{16}",cache_key,ui,flags=re.I)
          ui=ui.replace("p2k-2.15.3-widgets-20261111",cache_key)
          if "</head>" not in ui:raise RuntimeError("Missing UI </head>")
          ui=ui.replace("</head>",f'<meta name="p2k-build" content="{cache_key}">\n</head>',1)
          (payload/"ui-v2.html").write_text(ui)
          digest=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          man="".join(digest(payload/path)+"  ./"+path+"\n" for path in sorted(app_paths))
          (pkg/"CANDIDATE_PAYLOAD.sha256").write_text(man)
          rec="".join(digest(payload/path)+"  ./"+path+"\n" for path in sorted(recovery_paths))
          (pkg/"RECOVERY_PLANE.sha256").write_text(rec)
          metadata={"schema_version":1,"version":candidate_version,"source_head":source_head,
              "cache_key":cache_key,"build_id":"p2k-mca-recovery-v2154-"+source_head[:12]+"-web-upload",
              "payload_manifest_sha256":digest(pkg/"CANDIDATE_PAYLOAD.sha256"),
              "accepted_public_builds":accepted}
          (pkg/"CANDIDATE_RELEASE.json").write_text(json.dumps(metadata,indent=2)+"\n")
          (pkg/"README.txt").write_text("Upload this ZIP directly in P2K Release Control > Upload release ZIP.\n"
              "No SSH commands. This candidate requires public 2.15.3-b60ddb03b95c. It does not promote automatically.\n"
              "Upload prepares a candidate and preview only. It does not promote.\n"
              "Includes the four mandatory existing recovery-plane files, unchanged from repository.\n"
              "MCA: exhaustive 688-arena discovery, fixed nested score parsing, distinct paginated Results/attention tables. No data deletion or DB migration.\n")
          zip_dest=out/"P2K_MCA_Recovery_v2154_ReleaseControl_Upload.zip"
          with zipfile.ZipFile(zip_dest,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for file in pkg.rglob("*"):
              if file.is_file():z.write(file,file.relative_to(pkg))
          with zipfile.ZipFile(zip_dest) as z:
            assert z.testzip() is None
            assert "CANDIDATE_RELEASE.json" in z.namelist()
            assert "RECOVERY_PLANE.sha256" in z.namelist()
            assert "CANDIDATE_PAYLOAD.sha256" in z.namelist()
            assert len(z.namelist())==14
          print("Candidate ZIP:",zip_dest)
          print("Accepted public build:",accepted)
          print("Stamped cache key:",cache_key)
          print("SHA256:",digest(zip_dest))
          PY
      - name: Validate with the real ReleaseCandidatePackage contract
        shell: bash
        run: |
          php -r 'require "server/release-control/src/ReleaseSlotPolicy.php"; require "server/release-control/src/ReleaseCandidatePackage.php"; $p=(new P2K\ReleaseControl\ReleaseCandidatePackage("dist/P2K_MCA_Recovery_v2154_ReleaseControl_Upload"))->validate(); if($p["version"]!=="2.15.4" || $p["overlay_file_count"]!==6) exit(1); echo "Candidate contract OK: ".$p["release_id"].PHP_EOL;'
          for f in server/team-points/src/McaArenaParser.php server/team-points/src/McaResultsCronService.php; do php -l "$f"; done
          node --check assets/js/pages/team-points-features.js
          php -d zend.assertions=1 -d assert.exception=1 tests/test_v2154_mca_inventory.php
          python3 - <<'PY'
          from pathlib import Path
          html=Path('TeamPointsAdmin.html').read_text()
          js=Path('assets/js/pages/team-points-features.js').read_text()
          service=Path('server/team-points/src/McaResultsCronService.php').read_text()
          for key in ['liveRanksFilePager','liveRanksSyncIssuesPager']:
              assert key in html, key
              assert key in js, key
          assert 'mcaPage(attention' in js and 'mcaPage(files' in js
          assert 'adminArenaInventory' in service
          assert 'first confirmed by the previous successful index scan' not in service
          print('PASS MCA full-page inventory and pagination source contract')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-mca-recovery-v2154-release-control-direct-upload
          path: dist/P2K_MCA_Recovery_v2154_ReleaseControl_Upload.zip
          retention-days: 7
