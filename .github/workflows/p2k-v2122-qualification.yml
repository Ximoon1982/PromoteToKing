name: P2K v2.12.2 Events Showcase qualification

on:
  push:
    branches: [release/v2.12.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - name: v2.12.2 syntax and focused contracts
        run: |
          node --check assets/js/shared/recruitment-lineup-core.js
          node --check assets/js/shared/events-showcase-core.js
          node --check assets/js/admin/events-showcase-v2122.js
          node --check assets/js/admin/trophy-card-presentation-v2122.js
          node --check assets/js/admin/tool-registry.js
          php -l server/events-showcase/src/EventsShowcaseStore.php
          php -l server/events-showcase/public/api.php
          php -l server/events-showcase/public/embed.php
          php tests/test_events_showcase_store.php
          node tests/test_recruitment_lineup_parity.js
          python tests/test_events_showcase_contract.py
          bash -n tools/release/v2122/build-package.sh
          bash -n tools/release/v2122/qualify-installer.sh
          bash -n tools/release/v2122/install-promote-to-king-v2.12.2.sh
          python -m py_compile tools/release/v2122/production_paths.py tools/release/v2122/stamp_asset_cache_key.py tests/browser_gate_v2122.py
      - name: Events Showcase and Trophy browser gate
        run: python tests/browser_gate_v2122.py
      - name: Build qualified v2.12.2 incremental package
        run: bash tools/release/v2122/build-package.sh "$RUNNER_TEMP/build-v2122"
      - name: Scope-limited v2.12.1 incremental installer qualification
        run: bash tools/release/v2122/qualify-installer.sh "$RUNNER_TEMP/build-v2122"
      - name: Existing Match Recruitment browser gate
        run: python tests/browser_gate_recruit_match_v2.py
      - name: Existing Trophy v2.12.1 browser gate
        run: python tests/browser_gate_trophy_gallery_v2121.py
      - name: Inherited architecture and canonical audit
        run: |
          python tools/test-suite/architecture_gate.py
          python tools/test-suite/p2k_test_suite.py audit --json
      - name: Canonical static and JavaScript diagnostic
        run: python tools/test-suite/p2k_test_suite.py static
      - name: Canonical pytest diagnostic
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tools/test-suite/p2k_test_suite.py').resolve()
          spec = importlib.util.spec_from_file_location('p2k_test_suite_diag', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          report = module.inventory()
          failures = module.validate_policy(report)
          if failures:
              raise SystemExit('\n'.join(failures))
          module.pytest_gate(report)
          PY
      - name: Canonical standalone diagnostic
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tools/test-suite/p2k_test_suite.py').resolve()
          spec = importlib.util.spec_from_file_location('p2k_test_suite_diag', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          report = module.inventory()
          failures = module.validate_policy(report)
          if failures:
              raise SystemExit('\n'.join(failures))
          module.standalone_gate(report)
          PY
      - name: Full canonical P2K regression
        run: python tools/test-suite/p2k_test_suite.py regression
      - name: Full canonical P2K browser regression
        run: python tools/test-suite/p2k_test_suite.py browser
      - name: Upload qualified incremental installer
        uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.12.2-qualified-installer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-v2122/PromoteToKing_v2.12.2_INCREMENTAL_FROM_2.12.1.zip
            ${{ runner.temp }}/build-v2122/SHA256SUMS.txt
          if-no-files-found: error

  pytest-failure-diagnostic:
    name: Capture canonical pytest failure IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install canonical Python test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Capture canonical JUnit failure set
        run: |
          mkdir -p canonical-pytest-diagnostic
          python - <<'PY'
          import importlib.util, json, subprocess, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('.').resolve()
          harness_path = root / 'tools/test-suite/p2k_test_suite.py'
          spec = importlib.util.spec_from_file_location('p2k_test_suite_capture', harness_path)
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)
          report = harness.inventory()
          modules = [row['path'] for row in report['python']['modules'] if row['kind'] == 'pytest']
          out = root / 'canonical-pytest-diagnostic'
          junit = out / 'results.xml'
          completed = subprocess.run(
              [sys.executable, '-m', 'pytest', '-q', f'--junitxml={junit}', *modules],
              cwd=root, text=True, capture_output=True, check=False
          )
          actual = set()
          cases = 0
          if junit.is_file():
              tree = ET.parse(junit)
              rows = list(tree.getroot().iter('testcase'))
              cases = len(rows)
              for case in rows:
                  if case.find('failure') is None and case.find('error') is None:
                      continue
                  module = case.attrib.get('classname', '').replace('.', '/') + '.py'
                  if not module.startswith('tests/'):
                      module = 'tests/' + module
                  actual.add(f"{module}::{case.attrib.get('name', '')}")
          debt = json.loads(harness.DEBT.read_text(encoding='utf-8'))
          known = set(debt.get('known_failures', []))
          payload = {
              'pytest_returncode': completed.returncode,
              'cases': cases,
              'actual_failures': sorted(actual),
              'new_failures': sorted(actual - known),
              'resolved_known_failures': sorted(known - actual),
              'stdout_tail': completed.stdout[-12000:],
              'stderr_tail': completed.stderr[-12000:],
          }
          (out / 'canonical-pytest-failures.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps({k: payload[k] for k in ('pytest_returncode','cases','new_failures')}, indent=2))
          PY
      - name: Upload canonical pytest diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pytest-diagnostic-${{ github.sha }}
          path: canonical-pytest-diagnostic/
          if-no-files-found: error
