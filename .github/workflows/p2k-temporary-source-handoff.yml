name: Temporary P2K source handoff
on:
  push:
    paths:
      - '.github/workflows/p2k-temporary-source-handoff.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export checked out exact branch source
        shell: bash
        run: |
          mkdir -p /tmp/p2k-handoff
          git rev-parse HEAD > /tmp/p2k-handoff/HEAD
          tar -czf /tmp/p2k-handoff/source.tar.gz \
            assets/js/admin/events-showcase-v2122.js \
            assets/js/shared/events-showcase-core.js \
            assets/js/widgets/p2k-recruitment-radar-v2159.js \
            server/events-showcase \
            server/widgets/src/RecruitmentRadarGreenReadService.php \
            server/widgets/public/api.php \
            api/_common.php
          sha256sum /tmp/p2k-handoff/source.tar.gz > /tmp/p2k-handoff/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-temporary-source-handoff
          path: /tmp/p2k-handoff/
          retention-days: 1
