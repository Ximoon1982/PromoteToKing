name: P2K v2.14.3 qualification

on:
  push:
    branches: [release/v2.14.3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env: {MARIADB_ROOT_PASSWORD: root}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install MariaDB PHP driver
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql
          php -m | grep -qi pdo_mysql
      - name: Install browser regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - name: v2.14.3 syntax and release-slot contracts
        run: |
          test "$(cat VERSION)" = "2.14.3"
          php -l ReleaseControl.php
          php -l PreviewRouter.php
          php -l server/release-control/src/bootstrap.php
          php -l server/release-control/src/ReleaseControlAuth.php
          php -l server/release-control/src/ReleaseControlState.php
          php -l server/release-control/src/ReleaseSlotPolicy.php
          php -l server/release-control/src/ReleaseSlotFilesystemProbe.php
          php -l server/release-control/src/ReleaseSlotStore.php
          php -l server/release-control/src/ReleaseSlotMaterializer.php
          php -l server/release-control/src/ReleaseCandidatePackage.php
          php -l server/release-control/src/ReleaseStateStore.php
          php -l server/release-control/src/ReleaseCandidateInstaller.php
          php -l server/release-control/src/ReleasePreviewTree.php
          php -l server/release-control/src/ReleasePreviewSession.php
          php -l server/release-control/tools/materialize-current-slot.php
          php -l server/release-control/tools/install-candidate.php
          php -l server/release-control/tools/prepare-preview.php
          php -l server/release-control/tools/verify-slot.php
          php -l tests/php_v2140_release_control_harness.php
          php -l tests/php_v2141_release_slots_harness.php
          php -l tests/php_v2143_candidate_preview_harness.php
          php -l tests/php_v2143_preview_request_target_harness.php
          bash -n tools/release/v2143/build-universal-2.13x.sh
          bash -n tools/release/v2143/prepare-candidate-preview-v2.14.3.sh
          bash -n tools/release/v2143/install-promote-to-king-v2.14.3-universal.sh.in
          python -m py_compile tools/release/v2143/canonical-hash.py tools/release/v2143/stamp-runtime-cache-key.py server/release-control/tools/release-slot-paths.py
          python -m pytest -q tests/test_v2140_release_control.py tests/test_v2141_release_slots.py tests/test_v2142_candidate_install.py tests/test_v2143_candidate_preview.py
          php tests/php_v2143_session_runtime_harness.php
          php tests/php_v2140_release_control_harness.php
          php tests/php_v2143_preview_oauth_status_harness.php
          php tests/php_v2141_release_slots_harness.php
          php tests/php_v2142_candidate_install_harness.php
          php tests/php_v2143_candidate_preview_harness.php
          php tests/php_v2143_preview_request_target_harness.php
          python server/release-control/tools/release-slot-paths.py HEAD > "$RUNNER_TEMP/v2143-slot-paths.txt"
          grep -Fxq VERSION "$RUNNER_TEMP/v2143-slot-paths.txt"
          grep -Fxq ui-v2.html "$RUNNER_TEMP/v2143-slot-paths.txt"
          grep -Fxq server/team-points/src/Repository.php "$RUNNER_TEMP/v2143-slot-paths.txt"
          ! grep -Fxq .htaccess "$RUNNER_TEMP/v2143-slot-paths.txt"
          ! grep -Fq ReleaseControl.php "$RUNNER_TEMP/v2143-slot-paths.txt"
          ! grep -Fq PreviewRouter.php "$RUNNER_TEMP/v2143-slot-paths.txt"
          ! grep -Fq server/release-control/ "$RUNNER_TEMP/v2143-slot-paths.txt"
          ! grep -Eq '^(data|logs|storage)/' "$RUNNER_TEMP/v2143-slot-paths.txt"
          node --check assets/js/admin/admin-shell.js
          node --check assets/js/admin/tool-registry.js
          node --check assets/js/admin/trophy-gallery-admin-v2121.js
          node --check assets/js/admin/trophy-gallery-poc.js
          node --check assets/js/pages/challenge-list-assistant.js
          node tests/test_v2135_scope.js
          python -m pytest -q tests/test_v2133_trophy_admin_contract.py
          python -m pytest -q tests/test_v2134_trophy_admin_performance.py
          python tests/test_events_showcase_contract.py
      - name: Universal 2.13.x/2.14.x to 2.14.3 installer and candidate-preview bootstrap gate
        run: bash tests/test_v2143_universal_installer.sh
      - name: Build v2.14.3 cumulative incremental installer
        run: |
          bash tools/release/v2143/build-universal-2.13x.sh "$RUNNER_TEMP/v2143-qual"
          unzip -t "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x.zip"
          test -s "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/ASSET_CACHE_KEY.txt"
          test -s "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/BASELINES.tsv"
          test -s "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/CANDIDATE_RELEASE.json"
          test -s "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/CANDIDATE_PAYLOAD.sha256"
          test -x "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x/prepare-candidate-preview-v2.14.3.sh"
          sha256sum "$RUNNER_TEMP/v2143-qual/PromoteToKing_v2.14.3_INCREMENTAL_FROM_2.13.x.zip"
      - name: Trophy admin mount-race browser gate
        run: python tests/browser_gate_trophy_admin_mount_race_v2133.py
      - name: Focused Trophy Gallery v2.13.3 browser lifecycle
        run: python tests/browser_gate_trophy_gallery_v2121.py
      - name: Events Showcase and Trophy browser gate
        run: python tests/browser_gate_v2122.py
      - name: Events Showcase card renderer browser gate
        run: python tests/browser_gate_events_showcase_card_v2122.py
      - name: Events Showcase admin editor browser gate
        run: python tests/browser_gate_events_showcase_admin_v2122.py
      - name: Match Recruitment controller readiness browser gate
        run: python tests/browser_gate_recruit_match_ready_v2122.py
      - name: Match Recruitment native admin detail browser gate
        run: python tests/browser_gate_match_recruitment_admin_v2122.py
      - name: Existing Match Recruitment browser gate
        run: python tests/browser_gate_recruit_match_v2.py
      - name: Existing Trophy overlay/browser gates
        run: |
          python tests/browser_gate_trophy_gallery_overlay.py
          python tests/browser_gate_trophy_gallery_preview_containment.py
          python tests/browser_gate_v2120_trophy_mobile_engraver.py
      - name: Inherited architecture and canonical audit
        run: |
          python tools/test-suite/architecture_gate.py
          python tools/test-suite/p2k_test_suite.py audit --json
      - name: Full canonical P2K regression
        run: |
          set +e
          python tools/test-suite/p2k_test_suite.py regression > "$RUNNER_TEMP/p2k-v2143-regression.log" 2>&1
          rc=$?
          tail -n 300 "$RUNNER_TEMP/p2k-v2143-regression.log"
          exit "$rc"
      - name: Full canonical P2K browser regression
        run: python tools/test-suite/p2k_test_suite.py browser
