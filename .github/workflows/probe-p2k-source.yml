name: Probe P2K source archives
on:
  push:
    branches: [import-v2.10.6.23-canonical]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed archive negotiation
        shell: bash
        run: |
          set -u
          for f in \
            PromoteToKing_Standalone_v2.10.6.23_SOURCE.zip \
            PromoteToKing_Standalone_v2.10.6.22_SOURCE.zip \
            PromoteToKing_Standalone_v2.10.6.21_SOURCE.zip \
            PromoteToKing_Standalone_v2.10.6.20_SOURCE.zip
          do
            echo "===== $f ====="
            curl -sS -D /tmp/headers.txt -o /tmp/body.bin "https://www.promotetoking.org/$f" || true
            cat /tmp/headers.txt
            echo "BODY:"
            head -c 1200 /tmp/body.bin | strings
            echo
          done
