name: Probe P2K source archives
on:
  push:
    branches:
      - import-v2.10.6.23-canonical
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployed v2.10.6.19 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/v19.zip https://www.promotetoking.org/PromoteToKing_Standalone_v2.10.6.19_SOURCE.zip
          echo SIZE=$(wc -c </tmp/v19.zip)
          echo SHA256=$(sha256sum /tmp/v19.zip | cut -d' ' -f1)
          unzip -tq /tmp/v19.zip
          mkdir -p /tmp/v19
          unzip -q /tmp/v19.zip -d /tmp/v19
          echo VERSION_FILES
          find /tmp/v19 -name VERSION -type f -print -exec cat {} \;
          echo TOTAL_FILES=$(find /tmp/v19 -type f | wc -l)
