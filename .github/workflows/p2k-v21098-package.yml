name: P2K v2.10.9.8 validation and installer

on:
  push:
    branches:
      - release/v2.10.9.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          php -l server/team-points/public/recruitment-admin.php
          node --check assets/js/pages/v2-10-9-8.js
          node --check assets/js/site-config.js

      - name: Release regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "2.10.9.8"
          grep -Fq 'version: "2.10.9.8"' assets/js/site-config.js
          grep -Fq 'recruitmentAdminEndpoint' assets/js/site-config.js
          grep -Fq 'assets/js/pages/v2-10-9-8.js?v=2.10.9.8' assets/js/site-config.js
          grep -Fq 'data-key="result_coverage_percent"' assets/js/pages/v2-10-9-8.js
          grep -Fq 'textContent = "Result coverage"' assets/js/pages/v2-10-9-8.js
          grep -Fq 'parallelWorkers' assets/js/pages/v2-10-9-8.js
          grep -Fq 'action === '\''checkpoint'\''' server/team-points/public/recruitment-admin.php
          grep -Fq 'action === '\''csv'\''' server/team-points/public/recruitment-admin.php
          grep -Fq 'already current P2K member' server/team-points/public/recruitment-admin.php
          grep -Fq '"databaseSchemaChange": false' site-manifest.json
          grep -Fq '"runtimeDataReset": false' site-manifest.json

      - name: Build self-contained upgrade installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-v21098
          mkdir -p build-v21098/payload/server/team-points/public build-v21098/payload/assets/js/pages build-v21098/payload/assets/js
          cp server/team-points/public/recruitment-admin.php build-v21098/payload/server/team-points/public/
          cp assets/js/pages/v2-10-9-8.js build-v21098/payload/assets/js/pages/
          cp assets/js/site-config.js build-v21098/payload/assets/js/
          cp VERSION site-manifest.json RELEASE_NOTES_v2.10.9.8.md build-v21098/payload/
          tar -C build-v21098/payload -czf build-v21098/payload.tar.gz .
          PAYLOAD_SHA="$(sha256sum build-v21098/payload.tar.gz | awk '{print $1}')"

          cat > build-v21098/PromoteToKing_v2.10.9.8.run <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail

          RELEASE="2.10.9.8"
          BASELINE="2.10.9.7"
          SELF="${BASH_SOURCE[0]}"
          TARGET="${1:-.}"
          TARGET="$(cd "$TARGET" && pwd)"
          MARKER='__P2K_V21098_PAYLOAD_BELOW__'
          EXPECTED_PAYLOAD_SHA='__PAYLOAD_SHA__'

          fail(){ printf 'ERROR: %s\n' "$*" >&2; exit 1; }
          command -v tar >/dev/null 2>&1 || fail 'tar is required.'
          command -v base64 >/dev/null 2>&1 || fail 'base64 is required.'
          command -v sha256sum >/dev/null 2>&1 || fail 'sha256sum is required.'
          [[ -f "$TARGET/VERSION" ]] || fail "No Promote to King VERSION file found in $TARGET"
          INSTALLED="$(tr -d '\r\n[:space:]' < "$TARGET/VERSION")"
          [[ "$INSTALLED" == "$BASELINE" || "$INSTALLED" == "$RELEASE" ]] || fail "Expected v$BASELINE (or idempotent v$RELEASE), found v$INSTALLED."

          TMP="$(mktemp -d "${TMPDIR:-/tmp}/p2k-v21098.XXXXXX")"
          cleanup(){ rm -rf "$TMP"; }
          trap cleanup EXIT
          LINE="$(awk -v marker="$MARKER" '$0==marker{print NR+1; exit}' "$SELF")"
          [[ -n "$LINE" ]] || fail 'Installer payload marker is missing.'
          tail -n +"$LINE" "$SELF" | base64 -d > "$TMP/payload.tar.gz"
          ACTUAL="$(sha256sum "$TMP/payload.tar.gz" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED_PAYLOAD_SHA" ]] || fail 'Installer payload checksum mismatch.'
          mkdir -p "$TMP/payload"
          tar -C "$TMP/payload" -xzf "$TMP/payload.tar.gz"
          [[ "$(tr -d '\r\n[:space:]' < "$TMP/payload/VERSION")" == "$RELEASE" ]] || fail 'Payload VERSION mismatch.'
          php -l "$TMP/payload/server/team-points/public/recruitment-admin.php" >/dev/null || fail 'Recruitment PHP syntax check failed.'
          if command -v node >/dev/null 2>&1; then
            node --check "$TMP/payload/assets/js/pages/v2-10-9-8.js" >/dev/null || fail 'Recruitment JavaScript syntax check failed.'
            node --check "$TMP/payload/assets/js/site-config.js" >/dev/null || fail 'Site config JavaScript syntax check failed.'
          fi

          BACKUP_ROOT="$TARGET/data/release-backups"
          mkdir -p "$BACKUP_ROOT"
          BACKUP="$BACKUP_ROOT/v2.10.9.8-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          FILES=(
            server/team-points/public/recruitment-admin.php
            assets/js/pages/v2-10-9-8.js
            assets/js/site-config.js
            VERSION
            site-manifest.json
            RELEASE_NOTES_v2.10.9.8.md
          )
          EXISTING=()
          CREATED=()
          for file in "${FILES[@]}"; do
            if [[ -e "$TARGET/$file" ]]; then EXISTING+=("$file"); else CREATED+=("$file"); fi
          done
          if ((${#EXISTING[@]})); then tar -C "$TARGET" -czf "$BACKUP" "${EXISTING[@]}"; fi

          rollback(){
            status=$?
            if ((status!=0)); then
              printf 'Install failed; restoring pre-v%s files...\n' "$RELEASE" >&2
              for file in "${CREATED[@]}"; do rm -f "$TARGET/$file" || true; done
              if [[ -f "$BACKUP" ]]; then tar -C "$TARGET" -xzf "$BACKUP" || true; fi
            fi
            exit "$status"
          }
          trap rollback ERR

          mkdir -p "$TARGET/server/team-points/public" "$TARGET/assets/js/pages" "$TARGET/assets/js"
          install -m 0644 "$TMP/payload/server/team-points/public/recruitment-admin.php" "$TARGET/server/team-points/public/recruitment-admin.php"
          install -m 0644 "$TMP/payload/assets/js/pages/v2-10-9-8.js" "$TARGET/assets/js/pages/v2-10-9-8.js"
          install -m 0644 "$TMP/payload/assets/js/site-config.js" "$TARGET/assets/js/site-config.js"
          install -m 0644 "$TMP/payload/VERSION" "$TARGET/VERSION"
          install -m 0644 "$TMP/payload/site-manifest.json" "$TARGET/site-manifest.json"
          install -m 0644 "$TMP/payload/RELEASE_NOTES_v2.10.9.8.md" "$TARGET/RELEASE_NOTES_v2.10.9.8.md"

          [[ "$(tr -d '\r\n[:space:]' < "$TARGET/VERSION")" == "$RELEASE" ]] || fail 'Installed VERSION verification failed.'
          grep -Fq 'recruitmentAdminEndpoint' "$TARGET/assets/js/site-config.js" || fail 'Installed site-config verification failed.'
          grep -Fq 'Result coverage' "$TARGET/assets/js/pages/v2-10-9-8.js" || fail 'Installed table-alignment verification failed.'
          trap - ERR
          printf 'Promote to King v%s installed successfully in %s\n' "$RELEASE" "$TARGET"
          [[ -f "$BACKUP" ]] && printf 'Backup: %s\n' "$BACKUP"
          exit 0
          __P2K_V21098_PAYLOAD_BELOW__
          INSTALLER
          sed -i "s/__PAYLOAD_SHA__/$PAYLOAD_SHA/" build-v21098/PromoteToKing_v2.10.9.8.run
          base64 -w 76 build-v21098/payload.tar.gz >> build-v21098/PromoteToKing_v2.10.9.8.run
          chmod +x build-v21098/PromoteToKing_v2.10.9.8.run

          cat > build-v21098/install-promote-to-king-2.10.9.8.sh <<'LAUNCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          TARGET="${1:-.}"
          chmod +x "$HERE/PromoteToKing_v2.10.9.8.run"
          exec "$HERE/PromoteToKing_v2.10.9.8.run" "$TARGET"
          LAUNCHER
          chmod +x build-v21098/install-promote-to-king-2.10.9.8.sh
          sha256sum build-v21098/PromoteToKing_v2.10.9.8.run build-v21098/install-promote-to-king-2.10.9.8.sh > build-v21098/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.10.9.8-installer
          path: |
            build-v21098/PromoteToKing_v2.10.9.8.run
            build-v21098/install-promote-to-king-2.10.9.8.sh
            build-v21098/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
