name: P2K 2.15.10 timezone consistency and Release Control ZIP
on:
  push:
    branches: [release/v2.15.10]
    paths:
      - '.github/workflows/p2k-v21510-timezone-consistency.yml'
      - 'tests/timezone_consistency_v21510.cjs'
      - 'tests/php_v21510_showcase_local_times.php'
      - 'server/events-showcase/src/EventsShowcaseStore.php'
      - 'server/widgets/public/operations-api.php'
      - 'assets/js/widgets/p2k-operations-v21510.js'
      - 'server/widgets/public/administrator.php'
      - 'assets/js/widgets/p2k-recruitment-radar-v2159.js'
      - 'assets/js/events-showcase-line-v2122.js'
      - 'assets/js/shared/events-showcase-core.js'
      - 'assets/js/pages/analyze-match.js'
      - 'assets/js/pages/find-match.js'
      - 'assets/js/shared/match-history-ui.js'
      - 'assets/js/shared/upcoming-analysis-core.js'
      - 'assets/js/admin/events-showcase-v2122.js'
      - 'assets/js/admin/tool-registry.js'
      - 'server/events-showcase/public/embed-card.php'
      - 'server/events-showcase/public/embed.php'
      - 'server/widgets/public/embed.php'
      - 'assets/js/dashboard/match-assistant.js'
      - 'assets/js/dashboard/match-list-dialog.js'
      - 'assets/js/pages/match-creation-analyzer.js'
      - 'assets/js/pages/match-creation-charts.js'
      - 'ui-v2.html'
      - 'FindMatch.htm'
      - 'AnalyzeMatch.html'
      - 'AnalyzeMatches.htm'
      - 'MatchCreationAnalyzer.htm'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v2.15.10 promoted ancestry, syntax, display consistency and protective boundaries
        run: |
          set -euo pipefail
          BASE=d4fc5371deb72ec1ff41cb915d943d29f4b49911
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          while IFS= read -r path; do
            case "$path" in
              *.php) php -l "$path" ;;
              *.js) node --check "$path" ;;
              *.cjs) node --check "$path" ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          for tz in America/Los_Angeles Europe/Luxembourg Asia/Tokyo Pacific/Auckland America/New_York; do
            TZ="$tz" node tests/timezone_consistency_v21510.cjs
          done
          node tests/test_v21510_public_operations.cjs
          php tests/php_v21510_public_widget_batch_cleanup.php
          php tests/php_v21510_showcase_local_times.php
          php tests/php_v2147_release_management_harness.php
          php tests/php_v2148_filesystem_cleanup_harness.php
          node tests/widget_recruitment_radar_v2159.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          php=Path('server/widgets/public/operations-api.php').read_text()
          assert "day_grouping'=>'client_local_from_utc_buffer'" in php
          assert 'AND (".$where.")' in php
          html=Path('ui-v2.html').read_text()
          for s in ('admin-shell.js?v=p2k-2.15.10-administrator-b40a954cd66f',
                    'admin-session-controller.js?v=p2k-2.15.10-administrator-b40a954cd66f',
                    'tool-registry.js?v=p2k-2.15.10-showcase-local-dst-1'):
            assert s in html,s
          assert Path('server/release-control/src/ReleaseVersionManager.php').exists()
          assert Path('server/release-control/src/FilesystemCleanupManager.php').exists()
          assert "frame-ancestors 'self' https://www.chess.com https://chess.com" in Path('server/widgets/public/administrator.php').read_text()
          print('PASS promoted-admin compatibility, scoped anonymous API and unchanged protection model')
          PY
      - name: Package cumulative compatibility with current promoted production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import subprocess,json,zipfile
          base='d4fc5371deb72ec1ff41cb915d943d29f4b49911'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert subprocess.check_output(['git','merge-base',base,head],text=True).strip()==base
          changed=set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          recovery=['ReleaseControl.php','server/release-control/src/bootstrap.php',
              'server/release-control/src/ReleasePackageUploadInstaller.php',
              'server/release-control/src/FilesystemCleanupManager.php',
              'server/release-control/src/ReleaseVersionManager.php']
          excluded={'.github/workflows/p2k-v21510-timezone-consistency.yml',
              'tests/timezone_consistency_v21510.cjs',
              'tests/php_v21510_showcase_local_times.php'}
          allow={
              'server/widgets/public/operations-api.php',
              'assets/js/widgets/p2k-operations-v21510.js',
              'server/widgets/public/administrator.php',
              'assets/js/widgets/p2k-recruitment-radar-v2159.js',
              'assets/js/events-showcase-line-v2122.js',
              'assets/js/shared/events-showcase-core.js',
              'assets/js/pages/analyze-match.js',
              'assets/js/pages/find-match.js',
              'assets/js/shared/match-history-ui.js',
              'assets/js/shared/upcoming-analysis-core.js',
              'assets/js/admin/events-showcase-v2122.js',
              'server/events-showcase/src/EventsShowcaseStore.php',
              'assets/js/admin/tool-registry.js',
              'server/events-showcase/public/embed-card.php',
              'server/events-showcase/public/embed.php',
              'server/widgets/public/embed.php',
              'assets/js/dashboard/match-assistant.js',
              'assets/js/dashboard/match-list-dialog.js',
              'assets/js/pages/match-creation-analyzer.js',
              'assets/js/pages/match-creation-charts.js',
              'ui-v2.html','FindMatch.htm','AnalyzeMatch.html',
              'AnalyzeMatches.htm','MatchCreationAnalyzer.htm'}
          assert changed-excluded<=allow,changed-excluded-allow
          assert allow<=changed,allow-changed
          overlay=['VERSION']+sorted((changed-excluded)-{'ui-v2.html'})+['ui-v2.html']
          root=Path('dist/P2K_2.15.10_Timezone_Consistency_ReleaseControl')
          payload=root/'payload';payload.mkdir(parents=True,exist_ok=True)
          for name in sorted(set(overlay+recovery)):
            if name in {'VERSION','ui-v2.html'}:continue
            f=payload/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(Path(name).read_bytes())
          (payload/'VERSION').write_text('2.15.10\n')
          cache_key='p2k-2.15.10-'+head[:12]+'-'+sha256((head+'|timezone-v21510').encode()).hexdigest()[:16]
          html=Path('ui-v2.html').read_text()
          assert html.count('<head>')==1
          (payload/'ui-v2.html').write_text(html.replace('<head>','<head>\n<meta name="p2k-build" content="'+cache_key+'">',1))
          sha=lambda p:sha256(p.read_bytes()).hexdigest()
          (root/'CANDIDATE_PAYLOAD.sha256').write_text(
              ''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(overlay)))
          (root/'RECOVERY_PLANE.sha256').write_text(
              ''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(recovery)))
          meta={
              'schema_version':1,'version':'2.15.10','source_head':head,
              'cache_key':cache_key,'build_id':'p2k-v21510-timezone-'+head[:12],
              'qualification_workflow':'p2k-v21510-timezone-consistency.yml',
              'payload_manifest_sha256':sha(root/'CANDIDATE_PAYLOAD.sha256'),
              'accepted_public_builds':[{'version':'2.15.10','source_head':'399110495a85abe89c35618b7016d07ddb0521bb'}]
          }
          (root/'CANDIDATE_RELEASE.json').write_text(json.dumps(meta,indent=2)+'\n')
          (root/'README.txt').write_text(
              'P2K 2.15.10 timezone consistency corrective Release Control installer.\n'
              'Accepts current promoted public build 2.15.10-399110495a85.\n'
              'Public events: visitor-local match and arena starts, with displayed timezone.\n'
              'Public Club Operations: correct UTC SQL timestamp interpretation and client-local 7-day histogram.\n'
              'Match Creation Analyzer: visitor-local schedule days, DST-safe date arithmetic.\n'
              'Admin Showcase arena editor: browser-local time with event-date DST, explicit UTC instants and legacy fields.\n'
              'Arena scan and configured arena times are visitor-local; existing schedules keep exact instants.\n'
              'Existing widget/public access and batch cleanup protections are preserved.\n'
              'No database migration or CRON change. Upload ZIP to Release Control; preview and promote manually.\n')
          output=root.parent/('P2K_2.15.10_Timezone_Consistency_ReleaseControl_'+head[:12]+'.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for f in sorted(root.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(root))
          (root.parent/'SHA256SUMS').write_text(sha(output)+'  '+output.name+'\n')
          print('ZIP:',output,'size:',output.stat().st_size,'sha256:',sha(output))
          print('OVERLAY:',overlay)
          PY
      - name: Verify Release Control candidate, manifest and archive
        run: |
          set -euo pipefail
          php -r '
            require "server/release-control/src/ReleaseSlotPolicy.php";
            require "server/release-control/src/ReleaseCandidatePackage.php";
            $p=new \P2K\ReleaseControl\ReleaseCandidatePackage($argv[1]);
            $m=$p->validate();
            if ($m["version"]!=="2.15.10") exit(2);
            echo "PASS Release Control candidate ".$m["release_id"].", overlay=".$m["overlay_file_count"]."\n";
          ' dist/P2K_2.15.10_Timezone_Consistency_ReleaseControl
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          path=next(Path('dist').glob('P2K_2.15.10_Timezone_Consistency_ReleaseControl_*.zip'))
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            assert len(z.namelist())==len(set(z.namelist()))
            m=json.loads(z.read('CANDIDATE_RELEASE.json'))
            assert m['accepted_public_builds']==[{
                'version':'2.15.10','source_head':'399110495a85abe89c35618b7016d07ddb0521bb'}]
            for manifest in ('CANDIDATE_PAYLOAD.sha256','RECOVERY_PLANE.sha256'):
              for line in z.read(manifest).decode().splitlines():
                sha,p=line.split('  ./',1)
                assert hashlib.sha256(z.read('payload/'+p)).hexdigest()==sha,p
          print('PASS exact promoted-build compatibility and all package hashes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-v21510-timezone-consistency-release-control
          path: |
            dist/P2K_2.15.10_Timezone_Consistency_ReleaseControl_*.zip
            dist/SHA256SUMS
          retention-days: 14
