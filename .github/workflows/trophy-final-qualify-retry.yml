name: Retry final Trophy 2.11.5 qualification

on:
  push:
    branches: [feature/trophy-gallery-poc]
    paths: [.github/workflows/trophy-final-qualify-retry.yml]

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    if: github.event.head_commit.message == 'Retry final Trophy 2.11.5 qualification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trophy-gallery-poc
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify retry base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f1e8a149ea0661a16e8333f40f33840a6942f1aa"
          test "$(cat VERSION)" = "2.11.5"
          test -z "$(git status --porcelain)"

      - name: Recover final test and workflow from audited first attempt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/trophy-final-qualify-once.yml').read_text(encoding='utf-8').splitlines()
          def extract(start,end):
              out=[]; active=False
              for line in src:
                  if start in line:
                      active=True; continue
                  if active and line.strip()==end:
                      break
                  if active:
                      out.append(line[10:] if line.startswith('          ') else line)
              if not out:
                  raise SystemExit(f'Could not extract {start}')
              return '\n'.join(out)+'\n'
          test=extract("cat > tests/browser_gate_trophy_gallery_overlay.py <<'PYTEST'",'PYTEST')
          workflow=extract("cat > .github/workflows/trophy-gallery-poc.yml <<'YAML'",'YAML')
          workflow=workflow.replace('          bash tools/poc/trophy-gallery/r5fix3.9/install-p2k-version-2.11.5.sh "$GITHUB_WORKSPACE" verify\n','')
          Path('tests/browser_gate_trophy_gallery_overlay.py').write_text(test,encoding='utf-8')
          Path('.github/workflows/trophy-gallery-poc.yml').write_text(workflow,encoding='utf-8')
          PY
          grep -Fq 'Final 2.11.5 + r5fix3.8 installed-overlay browser runtime' .github/workflows/trophy-gallery-poc.yml
          ! grep -Fq 'install-p2k-version-2.11.5.sh "$GITHUB_WORKSPACE" verify' .github/workflows/trophy-gallery-poc.yml

      - name: Pre-commit final-state qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          git diff --check
          python -m py_compile tests/browser_gate_trophy_gallery_overlay.py
          node --check assets/js/admin/trophy-gallery-r5fix3.8.js
          php -l server/trophy-gallery/public/editor-meta.php
          test "$(cat VERSION)" = "2.11.5"
          grep -Fq 'version: "2.11.5"' assets/js/site-config.js
          grep -Fq '2.11.5-bf6a828490f57' assets/js/site-config.js
          test "$(sha256sum assets/js/admin/trophy-gallery-r5fix3.8.js | cut -c1-12)" = "d52193a71712"
          test "$(sha256sum assets/trophy-gallery/trophy-gallery-r5fix3.8.css | cut -c1-12)" = "fdcea54d62ba"
          bash tools/poc/trophy-gallery/r5fix3.8/install-trophy-gallery-r5fix3.8.sh "$GITHUB_WORKSPACE" verify
          python tests/browser_gate_trophy_gallery_overlay.py

      - name: Commit qualification update with ordinary Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ximoon1982'
          git config user.email 'ximoon@gmail.com'
          rm .github/workflows/trophy-final-qualify-once.yml .github/workflows/trophy-final-qualify-retry.yml
          git add -A
          git diff --cached --check
          git commit -m 'Qualify Trophy Gallery 2.11.5 final runtime'
          git push origin HEAD:feature/trophy-gallery-poc

      - name: Dispatch qualification on exact final commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run trophy-gallery-poc.yml --ref feature/trophy-gallery-poc
          echo 'Final qualification workflow dispatched.'
