name: Trophy Gallery 2.11.5 + r5fix3.8 qualification

on:
  push:
    branches: [feature/trophy-gallery-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin/tool-registry.js
          node --check assets/js/admin/trophy-gallery-poc.js
          node --check assets/js/admin/trophy-gallery-r5fix3.8.js
          node --check assets/js/admin/admin-shell.js
          node --check assets/js/pages/dashboard-v2.js
      - name: PHP syntax
        run: |
          php -l server/trophy-gallery/src/TrophyGalleryStore.php
          php -l server/trophy-gallery/public/api.php
          php -l server/trophy-gallery/public/media.php
          php -l server/trophy-gallery/public/editor-meta.php
      - name: Installer and repair-tool syntax
        run: |
          bash -n tools/poc/PromoteToKing_TrophyGallery_POC_2.11x.run
          bash -n tools/poc/install-trophy-gallery-poc.sh
          bash -n tools/poc/trophy-gallery/r5fix3.8/install-trophy-gallery-r5fix3.8.sh
          bash -n tools/poc/trophy-gallery/r5fix3.9/install-p2k-version-2.11.5.sh
          python -m py_compile tools/poc/trophy-gallery/r5fix2.2/consolidate-trophy-runtime.py tools/poc/trophy-gallery/r5fix3.8/patch-loaders.py tools/poc/trophy-gallery/r5fix3.9/version-align.py
      - name: Trophy Gallery POC static contract
        run: python -m pytest -q tests/test_trophy_gallery_poc.py tests/test_trophy_gallery_r5.py tests/test_trophy_gallery_media_lifecycle.py
      - name: Exact engraving POC 1.9.1 equivalence
        run: python tests/browser_compare_trophy_engraving.py
      - name: Trophy Gallery POC browser runtime
        run: python tests/browser_gate_trophy_gallery_poc.py
      - name: Final 2.11.5 + r5fix3.8 installed-overlay browser runtime
        run: python tests/browser_gate_trophy_gallery_overlay.py
      - name: Historical r5 overlay installer lifecycle
        run: |
          python tools/poc/build-trophy-gallery-r5-payload.py --check
          python -m pytest -q tests/test_trophy_gallery_overlay_installer.py
      - name: Verify approved r5fix3.8 and 2.11.5 deployment identities
        run: |
          test "$(cat VERSION)" = "2.11.5"
          grep -Fq 'version: "2.11.5"' assets/js/site-config.js
          grep -Fq '2.11.5-b9e1090f10b9d' assets/js/site-config.js
          grep -Fq 'r538-d52193a71712' ui-v2.html
          grep -Fq 'r538-fdcea54d62ba' ui-v2.html
          test "$(sha256sum assets/js/admin/trophy-gallery-r5fix3.8.js | cut -c1-12)" = "d52193a71712"
          test "$(sha256sum assets/trophy-gallery/trophy-gallery-r5fix3.8.css | cut -c1-12)" = "fdcea54d62ba"
          bash tools/poc/trophy-gallery/r5fix3.8/install-trophy-gallery-r5fix3.8.sh "$GITHUB_WORKSPACE" verify
      - name: Verify inherited v2.11.4 structural baseline
        run: |
          git worktree add --detach /tmp/p2k-qualified-v2114 6706e619d310e2c74fe2734cfcef8dd2f83d70d1
          (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/structural_parity_v2114.py)
      - name: Inherited architecture and canonical audit
        run: |
          python tools/test-suite/architecture_gate.py
          python tools/test-suite/p2k_test_suite.py audit --json
      - name: Full canonical P2K regression
        run: (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/p2k_test_suite.py regression)
      - name: Full canonical P2K browser regression
        run: (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/p2k_test_suite.py browser)
      - name: Keep final Trophy release isolated from v2.11.4
        run: |
          git diff --name-only 6706e619d310e2c74fe2734cfcef8dd2f83d70d1..HEAD | tee /tmp/changed
          python - <<'PY'
          from pathlib import Path
          version_files = {
              'AnalyzeMatch.html','AnalyzeMatchModal.html','AnalyzeMatches.htm','ChallengeListAssistant.html',
              'ClubIntelligence.html','DataReconciliation.html','FindMatch.htm','InsightsHealth.html',
              'LeagueSeasonCenter.html','LiveRanks.html','MatchCreationAnalyzer.htm','MigrationInstaller.html',
              'Opponents.html','RecruitMatch.html','RecruitmentAdmin.html','RecruitmentDemandPlanner.html',
              'TaskControl.html','TaskLogs.html','TeamInsights.html','TeamPointsAdmin.html','TeamPointsMigration.html',
              'TournamentAchievementBadgesDemo.html','TournamentManagement.html','Tournaments.html','VERSION',
              'assets/js/dashboard/insights-controller.js','assets/js/pages/dashboard-insights.js',
              'assets/js/pages/members-insights-enhancement.js','assets/js/shared/analytics.js',
              'assets/js/site-config.js','index.html','ui-v2.html',
          }
          exact = {
              '.github/workflows/trophy-gallery-poc.yml','assets/js/admin/admin-shell.js',
              'assets/js/admin/tool-registry.js','assets/js/admin/trophy-gallery-poc.js',
              'assets/js/pages/dashboard-v2.js','trophies/index.html',
              'tools/poc/PromoteToKing_TrophyGallery_POC_2.11x.run',
              'tools/poc/build-trophy-gallery-r5-payload.py','tools/poc/install-trophy-gallery-poc.sh',
              'tools/poc/README_TROPHY_GALLERY_POC_INSTALL.txt',
              'tests/browser_compare_trophy_engraving.py','tests/browser_gate_trophy_gallery_poc.py',
              'tests/browser_gate_trophy_gallery_overlay.py','tests/test_trophy_gallery_media_lifecycle.py',
              'tests/test_trophy_gallery_overlay_installer.py','tests/test_trophy_gallery_poc.py',
              'tests/test_trophy_gallery_r5.py',
          }
          prefixes = (
              'assets/trophy-gallery/','server/trophy-gallery/','tools/poc/engraving/',
              'tools/poc/trophy-gallery/','assets/js/admin/trophy-gallery-r5fix',
          )
          changed = {line.strip() for line in Path('/tmp/changed').read_text().splitlines() if line.strip()}
          unexpected = sorted(p for p in changed if p not in version_files and p not in exact and not p.startswith(prefixes))
          if unexpected:
              raise SystemExit('Unexpected final Trophy release changes:\n' + '\n'.join(unexpected))
          required = {
              'VERSION','assets/js/site-config.js','ui-v2.html','assets/js/admin/trophy-gallery-poc.js',
              'assets/js/admin/trophy-gallery-r5fix3.8.js','assets/trophy-gallery/trophy-gallery-r5fix3.8.css',
              'server/trophy-gallery/public/editor-meta.php','tests/browser_gate_trophy_gallery_overlay.py',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit('Required final Trophy release changes missing:\n' + '\n'.join(missing))
          print(f'Final Trophy release isolation OK: {len(changed)} changed paths, no unrelated surfaces.')
          PY
