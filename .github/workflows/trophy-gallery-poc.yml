name: Trophy Gallery POC smoke gate

on:
  push:
    branches: [feature/trophy-gallery-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin/tool-registry.js
          node --check assets/js/admin/trophy-gallery-poc.js
      - name: Trophy Gallery POC static contract
        run: python -m pytest -q tests/test_trophy_gallery_poc.py
      - name: Keep POC isolated from v2.11.4
        run: |
          git diff --name-only dcd71c8e76c07defacf6270aff4224b10484968b..HEAD | tee /tmp/changed
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'assets/js/admin/tool-registry.js',
              'assets/js/admin/trophy-gallery-poc.js',
              'tests/test_trophy_gallery_poc.py',
              '.github/workflows/trophy-gallery-poc.yml',
          }
          changed = {line.strip() for line in Path('/tmp/changed').read_text().splitlines() if line.strip()}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected POC changes:\n' + '\n'.join(unexpected))
          print('Trophy Gallery POC remains isolated from the v2.11.3 baseline.')
          PY
