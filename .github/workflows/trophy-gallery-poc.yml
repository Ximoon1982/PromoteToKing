name: Trophy Gallery POC r5 qualification

on:
  push:
    branches: [feature/trophy-gallery-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin/tool-registry.js
          node --check assets/js/admin/trophy-gallery-poc.js
          node --check assets/js/admin/admin-shell.js
          node --check assets/js/pages/dashboard-v2.js
      - name: PHP syntax
        run: |
          php -l server/trophy-gallery/src/TrophyGalleryStore.php
          php -l server/trophy-gallery/public/api.php
          php -l server/trophy-gallery/public/media.php
      - name: Installer shell syntax
        run: |
          bash -n tools/poc/PromoteToKing_TrophyGallery_POC_2.11x.run
          bash -n tools/poc/install-trophy-gallery-poc.sh
      - name: Trophy Gallery POC static contract
        run: python -m pytest -q tests/test_trophy_gallery_poc.py tests/test_trophy_gallery_r5.py
      - name: Trophy Gallery POC browser runtime
        run: python tests/browser_gate_trophy_gallery_poc.py
      - name: Trophy Gallery installed-overlay browser runtime
        run: python tests/browser_gate_trophy_gallery_overlay.py
      - name: Trophy Gallery overlay installer lifecycle
        run: python -m pytest -q tests/test_trophy_gallery_overlay_installer.py
      - name: Verify inherited v2.11.4 structural baseline
        run: |
          git worktree add --detach /tmp/p2k-qualified-v2114 6706e619d310e2c74fe2734cfcef8dd2f83d70d1
          (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/structural_parity_v2114.py)
      - name: Inherited architecture and canonical audit
        run: |
          python tools/test-suite/architecture_gate.py
          python tools/test-suite/p2k_test_suite.py audit --json
      - name: Full canonical P2K regression
        run: (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/p2k_test_suite.py regression)
      - name: Full canonical P2K browser regression
        run: (cd /tmp/p2k-qualified-v2114 && python tools/test-suite/p2k_test_suite.py browser)
      - name: Keep POC isolated from v2.11.4
        run: |
          git diff --name-only 6706e619d310e2c74fe2734cfcef8dd2f83d70d1..HEAD | tee /tmp/changed
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'assets/js/admin/tool-registry.js',
              'assets/js/admin/trophy-gallery-poc.js',
              'assets/js/admin/admin-shell.js',
              'assets/js/pages/dashboard-v2.js',
              'assets/trophy-gallery/engraving/P2KFullSans.ttf',
              'assets/trophy-gallery/engraving/medal_gold.png',
              'assets/trophy-gallery/engraving/medal_silver.png',
              'assets/trophy-gallery/engraving/medal_bronze.png',
              'assets/trophy-gallery/engraving/cup_gold.png',
              'assets/trophy-gallery/engraving/cup_silver.png',
              'assets/trophy-gallery/engraving/cup_bronze.png',
              'assets/trophy-gallery/engraving/crystal_gold.png',
              'assets/trophy-gallery/engraving/crystal_silver.png',
              'assets/trophy-gallery/engraving/crystal_bronze.png',
              'assets/trophy-gallery/engraving/editor.html',
              'server/trophy-gallery/src/TrophyGalleryStore.php',
              'server/trophy-gallery/public/api.php',
              'server/trophy-gallery/public/media.php',
              'trophies/index.html',
              'tools/poc/engraving/README.md',
              'tests/test_trophy_gallery_r5.py',
              'tests/browser_gate_trophy_gallery_poc.py',
              'tests/browser_gate_trophy_gallery_overlay.py',
              'tests/test_trophy_gallery_poc.py',
              'tests/test_trophy_gallery_overlay_installer.py',
              '.github/workflows/trophy-gallery-poc.yml',
              'tools/poc/PromoteToKing_TrophyGallery_POC_2.11x.run',
              'tools/poc/install-trophy-gallery-poc.sh',
              'tools/poc/README_TROPHY_GALLERY_POC_INSTALL.txt',
          }
          changed = {line.strip() for line in Path('/tmp/changed').read_text().splitlines() if line.strip()}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected POC changes:\n' + '\n'.join(unexpected))
          print('Trophy Gallery POC remains isolated from the qualified v2.11.4 baseline.')
          PY
