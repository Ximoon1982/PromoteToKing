name: P2K Showcase admin-only checks
on:
  push:
    paths:
      - assets/js/admin/events-showcase-v2122.js
      - server/events-showcase/public/admin-api.php
      - server/events-showcase/src/ArenaDiscoveryAdminService.php
      - tests/showcase-admin-discovery.php
      - .github/workflows/p2k-showcase-admin-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Lint admin-only PHP and JavaScript
        run: |
          php -l server/events-showcase/public/admin-api.php
          php -l server/events-showcase/src/ArenaDiscoveryAdminService.php
          node --check assets/js/admin/events-showcase-v2122.js
          php tests/showcase-admin-discovery.php
      - name: Read-only Chess.com page 2 pagination probe
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re
          url='https://www.chess.com/tournament/upcoming/arena?page=2'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req,timeout=15) as response:
              html=response.read(300000).decode('utf-8','replace')
              current=re.search(r'data-current-page="(\d+)"',html)
              total=re.search(r'data-total-pages="(\d+)"',html)
              print('HTTP',response.status,'current=',current.group(1) if current else 'missing',
                    'total=',total.group(1) if total else 'missing','rows=',html.count('tournaments-upcoming-name'))
          if not current or current.group(1)!='2':raise SystemExit('Source pagination validation failed')
          PY
