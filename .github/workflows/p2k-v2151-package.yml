name: P2K v2.15.1 package

on:
  push:
    branches: [release/v2.15.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Run v2.15.1 regressions
        run: |
          python3 -m pytest -q tests/test_v2151_challenge_activity_filters.py tests/test_v2150_trophy_modal_layout.py tests/test_v2150_task_control_tab_isolation.py tests/test_v2150_admin_profile_preview.py tests/test_v2150_preview_read_only_reads.py tests/test_v2150_player_title.py tests/test_v2150_tournament_discovery.py tests/test_v2150_tournament_monthly_cutoff.py tests/test_v2150_member_lookup_dossier.py tests/test_v2150_traffic_match_assistant.py tests/test_v2150_time_control_display.py tests/test_v2150_members_csv_resource_guard.py tests/test_v2150_storage_dual_axis.py tests/test_v2150_green_quick_discovered_livelock.py tests/test_v2150_green_roster_batching.py tests/test_v2150_green_cancelled_index_reconciliation.py tests/test_v2151_post_cutover_audit.py tests/test_v2151_analytics_achievement_convergence.py tests/test_v2151_post_cutover_insights_freshness.py tests/test_v2151_analytics_batch_writes.py tests/test_v2151_projection_invalidation.py tests/test_v2151_incremental_achievement_maintenance.py tests/test_v2151_achievement_target_scope.py tests/test_v2151_analytics_helper_runtime_resolver.py
          node --check assets/js/pages/challenge-list-assistant.js
          node --check assets/js/shared/real-oauth.js
          php -l server/team-points-green/src/GreenRepository.php
          php -l server/team-points-green/src/GreenCompatibility.php
          php -l server/team-points-green/public/api.php
          php -l server/team-points/public/members-insights-export.php
          php -l server/team-points/bin/analytics-convergence.php
          php -l server/team-points/bin/maintenance.php
          php -l server/team-points/src/FairPlayReconciliationService.php
          php -l server/team-points/src/StorageMetricsService.php
          php -l server/team-points/public/insights-health.php
          php -l server/team-points/public/fair-play-maintenance.php
          php -l server/team-points/bin/post-cutover-audit.php
          php tests/team_points_maintenance_cutover_v2150_test.php
          bash -n server/team-points/bin/install-analytics-convergence-cron.sh
          bash -n server/team-points/bin/cutover-blue-maintenance-cron.sh
      - name: Build v2.15.1 incremental candidate
        run: |
          bash tools/release/v2151/build-incremental.sh "$RUNNER_TEMP/v2151"
          ZIP="$RUNNER_TEMP/v2151/PromoteToKing_v2.15.1_INCREMENTAL_FROM_2.15.0.zip"
          ROOT="$RUNNER_TEMP/v2151/PromoteToKing_v2.15.1_INCREMENTAL_FROM_2.15.0"
          unzip -t "$ZIP"
          test -s "$ROOT/CANDIDATE_RELEASE.json"
          grep -Fq '"version": "2.15.1"' "$ROOT/CANDIDATE_RELEASE.json"
          test -s "$ROOT/CANDIDATE_PAYLOAD.sha256"
          test -s "$ROOT/RECOVERY_PLANE.sha256"
          grep -Fxq "ChallengeListAssistant.html" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "assets/css/challenge-list-assistant.css" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "assets/js/pages/challenge-list-assistant.js" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "TeamPointsAdmin.html" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/bin/analytics-convergence.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/src/AnalyticsBuilder.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/src/FairPlayReconciliationService.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/src/StorageMetricsService.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/bin/install-analytics-convergence-cron.sh" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/bin/maintenance.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/public/insights-health.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/public/fair-play-maintenance.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fxq "server/team-points/bin/post-cutover-audit.php" "$ROOT/CANDIDATE_OVERLAY_PATHS.txt"
          grep -Fq "PublicReadDatabase::core()" "$ROOT/payload/server/team-points/bin/analytics-convergence.php"
          grep -Fq "projection-v2151-content-v1" "$ROOT/payload/server/team-points/src/AnalyticsBuilder.php"
          grep -Fq "array_slice(\$targets,\$cursor,20)" "$ROOT/payload/server/team-points/src/AnalyticsBuilder.php"
          grep -Fq "historical_backfill_auto" "$ROOT/payload/server/team-points/src/FairPlayReconciliationService.php"
          grep -Fq "SELECT DATABASE()" "$ROOT/payload/server/team-points/src/StorageMetricsService.php"
          grep -Fq 'rtrim((string)\$argv[2]' "$ROOT/payload/server/team-points/bin/install-analytics-convergence-cron.sh"
          grep -Fq "PublicReadDatabase::analytics()" "$ROOT/payload/server/team-points/bin/maintenance.php"
          grep -Fq '"source_head": "3776ecdd6b91b67816f5fa3853e763ac5b5d7f98"' "$ROOT/CANDIDATE_RELEASE.json"
          grep -Fq '"source_head": "0bafb17000c118d0a40feaa5e9c5bba65bbf9b84"' "$ROOT/CANDIDATE_RELEASE.json"
          grep -Fxq "$(git rev-parse HEAD)" "$ROOT/SOURCE_HEAD.txt"
          sha256sum "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.15.1-incremental-${{ github.sha }}
          path: ${{ runner.temp }}/v2151/PromoteToKing_v2.15.1_INCREMENTAL_FROM_2.15.0.zip
          if-no-files-found: error
          retention-days: 30
