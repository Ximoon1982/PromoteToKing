name: P2K v2.12.1 corrective release qualification

on:
  push:
    branches: [release/v2.12.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)" /usr/bin/chromium
      - name: v2.12.1 runtime syntax
        run: |
          node --check assets/js/admin/tool-registry.js
          node --check assets/js/admin/trophy-gallery-v2121-admin.js
          node --check assets/js/admin/trophy-gallery-v2121-view.js
          node --check assets/js/admin/trophy-gallery-v2121-matches.js
          node --check assets/js/admin/trophy-gallery-v2121-engraver.js
          node --check assets/js/admin/trophy-gallery-v2121-public.js
          node --check assets/js/pages/recruit-match-v2121-bootstrap.js
          php -l server/trophy-gallery/src/TrophyGalleryStore.php
          php -l server/trophy-gallery/public/api.php
          php -l server/trophy-gallery/public/editor-meta.php
          bash -n tools/release/v2121/build-package.sh
          bash -n tools/release/v2121/qualify-installer.sh
          bash -n tools/release/v2121/install-promote-to-king-v2.12.1.sh
          python -m py_compile tools/release/v2121/production_paths.py tools/release/v2121/stamp_asset_cache_key.py
      - name: Build qualified v2.12.1 incremental package
        run: bash tools/release/v2121/build-package.sh "$RUNNER_TEMP/build-v2121"
      - name: Exact 2.11.5 and 2.12.0 installer qualification
        run: bash tools/release/v2121/qualify-installer.sh "$RUNNER_TEMP/build-v2121"
      - name: Match Recruitment focused browser gate
        run: python tests/browser_gate_recruit_match_v2.py
      - name: Trophy Hall and admin browser gate
        run: python tests/browser_gate_trophy_gallery_overlay.py
      - name: Trophy portrait and engraver browser gate
        run: python tests/browser_gate_v2120_trophy_mobile_engraver.py
      - name: Inherited architecture and canonical audit
        run: |
          python tools/test-suite/architecture_gate.py
          python tools/test-suite/p2k_test_suite.py audit --json
      - name: Full canonical P2K regression
        run: python tools/test-suite/p2k_test_suite.py regression
      - name: Full canonical P2K browser regression
        run: python tools/test-suite/p2k_test_suite.py browser
      - name: Upload qualified incremental installer
        uses: actions/upload-artifact@v4
        with:
          name: PromoteToKing-v2.12.1-qualified-installer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-v2121/PromoteToKing_v2.12.1_INCREMENTAL.zip
            ${{ runner.temp }}/build-v2121/SHA256SUMS.txt
          if-no-files-found: error
