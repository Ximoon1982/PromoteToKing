name: P2K 2.15.11 MCA administration direct access repair
on:
  push:
    branches: [release/v2.15.11]
    paths:
      - '.github/workflows/p2k-v21511-mca-admin-access.yml'
      - 'assets/js/admin/admin-shell.js'
      - 'ui-v2.html'
      - 'tests/admin_mca_direct_access_v21511.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate MCA direct link and retain existing MCA and Release Control behavior
        run: |
          set -euo pipefail
          BASE=3024e0520083934a52d41addb655d061a3c71b2a
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          node --check assets/js/admin/admin-shell.js
          node --check tests/admin_mca_direct_access_v21511.cjs
          node tests/admin_mca_direct_access_v21511.cjs
          php tests/php_v21511_mca_removed_pages.php
          node tests/showcase_datetime_v21511.cjs
          php tests/php_v21510_showcase_local_times.php
          node tests/test_v21510_public_operations.cjs
          php tests/php_v2147_release_management_harness.php
          php tests/php_v2148_filesystem_cleanup_harness.php
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='3024e0520083934a52d41addb655d061a3c71b2a'
          for p in ['server/team-points/src/McaArenaParser.php',
                    'server/team-points/src/McaResultsCronService.php',
                    'server/team-points/src/LiveRanksService.php',
                    'assets/js/pages/team-points-features.js',
                    'TeamPointsAdmin.html',
                    'server/events-showcase/src/EventsShowcaseStore.php']:
              assert not subprocess.check_output(['git','diff','--name-only',base,'HEAD','--',p]).strip(),p
          assert 'adminShellDetailStandalone' in Path('assets/js/admin/admin-shell.js').read_text()
          print('PASS MCA scraping, admin controls, scoring and stored schedule sources unchanged')
          PY
      - name: Build minimal 2.15.11 Release Control candidate for promoted 3024 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import subprocess,json,zipfile
          base='3024e0520083934a52d41addb655d061a3c71b2a'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert subprocess.check_output(['git','merge-base',base,head],text=True).strip()==base
          changed=set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          expected={'assets/js/admin/admin-shell.js','ui-v2.html'}
          allowed=expected|{
              'tests/admin_mca_direct_access_v21511.cjs',
              '.github/workflows/p2k-v21511-mca-admin-access.yml'}
          assert changed==allowed,{'actual':changed,'expected':allowed}
          recovery=['ReleaseControl.php','server/release-control/src/bootstrap.php',
              'server/release-control/src/ReleasePackageUploadInstaller.php',
              'server/release-control/src/FilesystemCleanupManager.php',
              'server/release-control/src/ReleaseVersionManager.php']
          overlay=['VERSION','ui-v2.html','assets/js/admin/admin-shell.js']
          root=Path('dist/P2K_2.15.11_MCA_Admin_Access_ReleaseControl')
          payload=root/'payload';payload.mkdir(parents=True,exist_ok=True)
          for p in sorted(set(recovery)|{'assets/js/admin/admin-shell.js'}):
              target=payload/p;target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(Path(p).read_bytes())
          (payload/'VERSION').write_text('2.15.11\n')
          cache_key='p2k-2.15.11-'+head[:12]+'-'+sha256((head+'|mca-admin-direct-access-v21511').encode()).hexdigest()[:16]
          html=Path('ui-v2.html').read_text()
          assert html.count('<head>')==1
          (payload/'ui-v2.html').write_text(
              html.replace('<head>','<head>\n<meta name="p2k-build" content="'+cache_key+'">',1))
          sha=lambda path:sha256(path.read_bytes()).hexdigest()
          (root/'CANDIDATE_PAYLOAD.sha256').write_text(
              ''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(overlay)))
          (root/'RECOVERY_PLANE.sha256').write_text(
              ''.join(sha(payload/p)+'  ./'+p+'\n' for p in sorted(recovery)))
          metadata={
              'schema_version':1,'version':'2.15.11','source_head':head,
              'cache_key':cache_key,'build_id':'p2k-v21511-mca-admin-access-'+head[:12],
              'qualification_workflow':'p2k-v21511-mca-admin-access.yml',
              'payload_manifest_sha256':sha(root/'CANDIDATE_PAYLOAD.sha256'),
              'accepted_public_builds':[{'version':'2.15.11','source_head':base}]
          }
          (root/'CANDIDATE_RELEASE.json').write_text(json.dumps(metadata,indent=2)+'\n')
          (root/'README.txt').write_text(
              'P2K 2.15.11 MCA administration access repair.\n'
              'Compatible with promoted 2.15.11-3024e0520083.\n'
              'Adds Open MCA administration directly to the embedded administration detail.\n'
              'Makes the tool reachable even if the embedded frame is unavailable.\n'
              'Corrects the permanently displayed Loading live administration data text on deep-linked detail pages.\n'
              'Preserves existing embedded tool, operator login, user permissions, MCA scraper, CSV points, and retry actions.\n'
              'No database, CRON, source files, scoring, source import or arena schedule changes.\n'
              'Upload ZIP through Admin > Maintenance > Release Control, preview, then manually promote.\n')
          output=root.parent/('P2K_2.15.11_MCA_Admin_Access_ReleaseControl_'+head[:12]+'.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file():z.write(f,f.relative_to(root))
          (root.parent/'SHA256SUMS').write_text(sha(output)+'  '+output.name+'\n')
          print('ZIP',output,output.stat().st_size,'bytes SHA256',sha(output))
          print('Release',metadata)
          PY
      - name: Validate release package using Release Control contract
        run: |
          set -euo pipefail
          php -r '
            require "server/release-control/src/ReleaseSlotPolicy.php";
            require "server/release-control/src/ReleaseCandidatePackage.php";
            $candidate=new \P2K\ReleaseControl\ReleaseCandidatePackage($argv[1]);
            $m=$candidate->validate();
            if ($m["version"]!=="2.15.11") exit(2);
            if ($m["accepted_public_builds"]!==[["version"=>"2.15.11","source_head"=>"3024e0520083934a52d41addb655d061a3c71b2a"]]) exit(3);
            echo "PASS Release Control candidate ".$m["release_id"]." overlay ".$m["overlay_file_count"]."\n";
          ' dist/P2K_2.15.11_MCA_Admin_Access_ReleaseControl
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          path=next(Path('dist').glob('P2K_2.15.11_MCA_Admin_Access_ReleaseControl_*.zip'))
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              m=json.loads(z.read('CANDIDATE_RELEASE.json'))
              assert m['version']=='2.15.11'
              assert m['accepted_public_builds']==[{
                  'version':'2.15.11','source_head':'3024e0520083934a52d41addb655d061a3c71b2a'}]
              for manifest in ('CANDIDATE_PAYLOAD.sha256','RECOVERY_PLANE.sha256'):
                  for line in z.read(manifest).decode().splitlines():
                      hash_value,p=line.split('  ./',1)
                      assert hashlib.sha256(z.read('payload/'+p)).hexdigest()==hash_value,p
              assert hashlib.sha256(z.read('CANDIDATE_PAYLOAD.sha256')).hexdigest()==m['payload_manifest_sha256']
          print("PASS ZIP, manifests, exact source and production compatibility")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2k-v21511-mca-admin-direct-access-release-control
          path: |
            dist/P2K_2.15.11_MCA_Admin_Access_ReleaseControl_*.zip
            dist/SHA256SUMS
          retention-days: 14
