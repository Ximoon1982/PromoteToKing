<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Promote to King Tools</title>
  <link rel="icon" type="image/jpeg" href="assets/images/p2k-logo.jpg">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <img
        src="assets/images/p2k-logo.jpg"
        alt="Promote to King club logo"
      >
      <div>
        <h1>Promote to King Tools</h1>
        <p class="site-subtitle">
          Match selection, upcoming-match management, match creation,
          and open team-match analysis.
        </p>
      </div>
    </header>

    <nav class="site-tabs" role="tablist" aria-label="Promote to King tools">
      <button
        class="site-tab"
        id="tab-find"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="tool-content"
        data-key="find"
        data-route="FindMatch.htm"
      >Match Assistant</button>

      <button
        class="site-tab"
        id="tab-upcoming"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="tool-content"
        data-key="upcoming"
        data-route="AnalyzeMatches.htm"
        tabindex="-1"
      >Upcoming Matches</button>

      <button
        class="site-tab"
        id="tab-creation"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="tool-content"
        data-key="creation"
        data-route="MatchCreationAnalyzer.htm"
        tabindex="-1"
      >Match Creation</button>

      <button
        class="site-tab"
        id="tab-open"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="tool-content"
        data-key="open"
        data-route="AnalyzeMatch.html"
        tabindex="-1"
      >Open Match Analyzer</button>
    </nav>

    <section
      class="tool-content"
      id="tool-content"
      role="tabpanel"
      aria-labelledby="tab-find"
      aria-live="polite"
    >
      <div class="tool-loading" id="tool-loading">
        Loading Match Assistant…
      </div>
    </section>
  </main>

  <script src="assets/js/pages/site-tabs.js"></script>
</body>
</html>
