<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Promote to King · Tournaments</title><style>
:root{color-scheme:dark;--card:#211e1b;--gold:#f6b73c;--orange:#d98d18;--text:#eee;--cream:#f0e4cf;--muted:#aaa198;--line:rgba(255,255,255,.10);--green:#91e09a;--blue:#aee0f3;--silver:#c9d0d6;--bronze:#d89962}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:transparent;color:var(--text);font:14px Arial,sans-serif}main{display:grid;gap:12px}.hero,.card{border:1px solid var(--line);border-radius:11px;background:linear-gradient(145deg,#27231f,#191715);box-shadow:0 8px 22px #0005}.hero{display:flex;justify-content:space-between;gap:15px;padding:16px}.hero h1{margin:0;color:var(--gold);font-size:27px}.hero p{margin:5px 0 0;color:var(--muted);line-height:1.5}.stamp{color:#9fb1b9;font-size:11px;text-align:right}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{padding:11px;border:1px solid var(--line);border-radius:9px;background:#0003}.metric span,.metric strong{display:block}.metric span{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.metric strong{margin-top:5px;color:#fff3df;font-size:22px}.card{padding:14px}.controls{display:grid;grid-template-columns:minmax(230px,1.6fr) repeat(2,minmax(150px,.55fr));gap:8px;margin-bottom:12px}.controls label span{display:block;margin:0 0 4px;color:var(--muted);font-size:10px;font-weight:850;text-transform:uppercase}input,select{width:100%;min-height:39px;padding:9px;border:1px solid #ffffff22;border-radius:8px;background:#111;color:#eee}.tabs{display:flex;gap:5px;margin-bottom:10px;padding:4px;border:1px solid var(--line);border-radius:9px;background:#0003}.tab{flex:1;min-height:38px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-weight:850;cursor:pointer}.tab.active{background:var(--orange);color:#fff}.tablehead,.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;color:var(--muted);font-size:12px}.pager>div{display:flex;gap:6px;align-items:center}.pager button{min-height:34px;padding:6px 10px;border:1px solid #ffffff22;border-radius:7px;background:#151311;color:#ddd;font:inherit;font-weight:800;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:#0002}table{width:100%;min-width:900px;border-collapse:collapse;font-size:16px}th,td{padding:11px 12px;border-bottom:1px solid #ffffff11;text-align:left;vertical-align:middle}thead th{position:sticky;top:0;z-index:2;background:#201c18;color:#ffd078;font-size:14px;text-transform:uppercase;letter-spacing:.035em;white-space:nowrap}tbody tr:hover{background:#ffffff08}tbody tr.is-highlighted{background:rgba(246,183,60,.22);outline:2px solid rgba(246,183,60,.72);outline-offset:-2px;animation:flash 1.2s ease 2}@keyframes flash{50%{background:rgba(246,183,60,.42)}}.num{text-align:right}.center{text-align:center}.sort{padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:900;cursor:pointer}.sort::after{content:' ↕';opacity:.42}.sort[data-dir=asc]::after{content:' ▲';opacity:1}.sort[data-dir=desc]::after{content:' ▼';opacity:1}.name{color:var(--cream);font-weight:850;text-decoration:none}.name:hover{text-decoration:underline}.sub{display:block;margin-top:4px;color:var(--muted);font-size:11px}.chip,.medal{display:inline-flex;margin:2px 3px 2px 0;padding:4px 8px;border:1px solid #ffffff20;border-radius:99px;font-size:12px;font-weight:850}.status-finished{color:var(--green);border-color:#4fa85b55}.status-progress{color:#ffd078;border-color:#e2a12855}.status-registration{color:#9dd5f7;border-color:#5ea6d355}.gold{color:#ffd56a;border-color:#f6b73c66}.silver{color:var(--silver);border-color:#bfc7cf55}.bronze{color:var(--bronze);border-color:#d8996255}.player{padding:0;border:0;background:transparent;color:var(--cream);font:inherit;font-weight:850;text-decoration:underline;text-decoration-color:#ffffff33;cursor:pointer}.player:hover{color:#ffd078}.empty{padding:26px;text-align:center;color:var(--muted)}.filter-note{margin:0 0 10px;padding:9px 11px;border:1px solid rgba(121,199,232,.25);border-radius:8px;background:rgba(121,199,232,.06);color:#c9e3ee}.modalback{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#000c;z-index:100}.modal{width:min(920px,96vw);max-height:90vh;overflow:auto;border:1px solid #f6b73c55;border-radius:13px;background:linear-gradient(145deg,#29241f,#151311)}.modalhead{display:flex;justify-content:space-between;gap:12px;padding:15px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;color:var(--gold)}.close{width:37px;height:37px;border:1px solid #ffffff2b;border-radius:50%;background:#0003;color:#eee;font-size:22px;cursor:pointer}.modalbody{padding:14px}.error{padding:13px;border:1px solid #d94a3a55;border-radius:9px;background:#d94a3a0c;color:#ffad9f}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.hero{flex-direction:column}.stamp{text-align:left}table{font-size:15px}thead th{font-size:11px}.pager{align-items:flex-start;flex-direction:column}}
.medal-head{display:inline-block;margin-right:5px;font-size:16px;vertical-align:-1px}.medal-head.gold{color:#ffd56a}.medal-head.silver{color:var(--silver)}.medal-head.bronze{color:var(--bronze)}.medal-count-cell{border-top:2px solid transparent;border-bottom:2px solid transparent}.medal-count-cell.medal-gold{border-top-color:#f6b73c;border-bottom-color:#f6b73c}.medal-count-cell.medal-silver{border-top-color:#c9d0d6;border-bottom-color:#c9d0d6}.medal-count-cell.medal-bronze{border-top-color:#d89962;border-bottom-color:#d89962}</style><script src="assets/js/shared/embedded-page.js?v=2.10.6"></script><script src="assets/js/shared/active-convergence-refresh.js?v=2.10.6"></script>
<link href="assets/css/responsive-unification.css?v=2.10.6" rel="stylesheet"/>
<script defer src="assets/js/shared/traffic-analytics.js?v=2.10.6"></script>
<script defer src="assets/js/shared/real-oauth.js?v=2.10.6"></script>
</head><body><main>
<section class="metrics"><div class="metric"><span>Tournaments</span><strong id="mT">—</strong></div><div class="metric"><span>Finished</span><strong id="mF">—</strong></div><div class="metric"><span>In progress</span><strong id="mP">—</strong></div><div class="metric"><span>Medalists</span><strong id="mM">—</strong></div></section>
<section class="card"><div class="controls"><label><span>Search tournament or member</span><input id="search" type="search" placeholder="Tournament, period or player"></label><label><span>Year</span><select id="year"><option value="all">All years</option></select></label><label><span>Type</span><select id="type"><option value="all">All types</option><option value="quarterly">Quarterly rank</option><option value="christmas">Christmas</option><option value="top10">Monthly top 10</option><option value="top32">Monthly top 32</option></select></label></div><p class="filter-note" id="playerFilter" hidden></p><div class="tabs"><button class="tab active" data-panel="ranking">Podium ranking</button><button class="tab" data-panel="tournaments">Tournaments</button></div>
<div id="panel-tournaments" hidden><div class="tablehead"><span id="tCount">No tournaments loaded</span><span>At most 25 rows per page</span></div><div class="tablewrap"><table><thead><tr><th><button class="sort" data-table="t" data-key="name">Tournament</button></th><th><button class="sort" data-table="t" data-key="type">Type</button></th><th><button class="sort" data-table="t" data-key="periodSort">Period</button></th><th><button class="sort" data-table="t" data-key="status">Status</button></th><th><button class="sort" data-table="t" data-key="gold"><span class="medal-head gold" aria-hidden="true">🥇</span>1st</button></th><th><button class="sort" data-table="t" data-key="silver"><span class="medal-head silver" aria-hidden="true">🥈</span>2nd</button></th><th><button class="sort" data-table="t" data-key="bronze"><span class="medal-head bronze" aria-hidden="true">🥉</span>3rd</button></th></tr></thead><tbody id="tBody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div><div class="pager" id="tPager"></div></div>
<div id="panel-ranking"><div class="tablehead"><span id="rCount">No medalists loaded</span><span>Order: gold → silver → bronze</span></div><div class="tablewrap"><table><thead><tr><th class="center"><button class="sort" data-table="r" data-key="rank">Rank</button></th><th><button class="sort" data-table="r" data-key="name">Player</button></th><th class="num"><button class="sort" data-table="r" data-key="gold"><span class="medal-head gold" aria-hidden="true">🥇</span>1st</button></th><th class="num"><button class="sort" data-table="r" data-key="silver"><span class="medal-head silver" aria-hidden="true">🥈</span>2nd</button></th><th class="num"><button class="sort" data-table="r" data-key="bronze"><span class="medal-head bronze" aria-hidden="true">🥉</span>3rd</button></th><th class="num"><button class="sort" data-table="r" data-key="podiums">Podiums</button></th><th class="num"><button class="sort" data-table="r" data-key="tournamentCount">Tournaments</button></th></tr></thead><tbody id="rBody"></tbody></table></div><div class="pager" id="rPager"></div></div><div class="error" id="error" hidden></div></section>
</main><div class="modalback" id="modal" hidden><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><div><h2 id="modalTitle">Player</h2><div class="sub" id="modalSummary"></div></div><button class="close" id="close">×</button></div><div class="modalbody"><div class="tablewrap"><table><thead><tr><th>Tournament</th><th>Period</th><th>Medal</th></tr></thead><tbody id="modalBody"></tbody></table></div></div></section></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),embedded=params.get('embedded')==='1'||window.parent!==window,PAGE=25;
const playerQuery=String(params.get('player')||'').trim(),podiumQuery=String(params.get('podium')||'').trim();
let active=params.get('panel')==='tournaments'?'tournaments':'ranking',rPage=1,tPage=1,rSort={key:'rank',dir:'asc'},tSort={key:'periodSort',dir:'desc'},summaryLoaded=false,tournamentsLoaded=false,searchTimer=0;
const key=v=>String(v||'').trim().toLowerCase();
const typeText=t=>({quarterly:'Quarterly rank',christmas:'Christmas',top10:'Monthly top 10',top32:'Monthly top 32'})[t]||t||'—';
const statusText=s=>String(s||'unknown').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const statusClass=s=>{s=key(s);return s==='finished'?'status-finished':s.includes('progress')?'status-progress':s.includes('registration')?'status-registration':''};
function resize(){try{parent.postMessage({type:'p2k-frame-height',height:document.documentElement.scrollHeight+8},'*')}catch(_){}}
async function get(view,extra={}){const q=new URLSearchParams({view,...extra});const r=await fetch(`server/tournaments/public/browse.php?${q}`,{credentials:'same-origin',cache:'default'});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error?.message||`HTTP ${r.status}`);return j;}
function setError(msg=''){$('error').hidden=!msg;$('error').textContent=msg;resize()}
function applySummary(j){const m=j.summary||{};$('mT').textContent=m.total??'—';$('mF').textContent=m.finished??'—';$('mP').textContent=m.in_progress??'—';$('mM').textContent=m.medalists??'—';$('year').innerHTML='<option value="all">All years</option>'+((j.years||[]).map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join(''));summaryLoaded=true;resize()}
function pager(host,p,onPage){const page=Number(p.page||1),pages=Number(p.total_pages||1),total=Number(p.total_rows||0);host.innerHTML=`<span>Page ${page} of ${pages} · ${total} rows · maximum ${PAGE} per page</span><div><button data-p="prev" ${page<=1?'disabled':''}>Previous</button><button data-p="next" ${page>=pages?'disabled':''}>Next</button></div>`;host.querySelector('[data-p=prev]')?.addEventListener('click',()=>onPage(page-1));host.querySelector('[data-p=next]')?.addEventListener('click',()=>onPage(page+1))}
function sortMarkers(table,sort){document.querySelectorAll(`.sort[data-table=${table}]`).forEach(b=>b.dataset.dir=b.dataset.key===sort.key?sort.dir:'')}
async function loadRanking(){try{const search=podiumQuery||$('search').value.trim();$('rBody').innerHTML='<tr><td colspan="7" class="empty">Loading podium ranking…</td></tr>';const j=await get('ranking',{page:String(rPage),page_size:String(PAGE),search,sort:rSort.key,direction:rSort.dir});if(!summaryLoaded)applySummary(j);const rows=j.rows||[];$('rCount').textContent=`${j.pagination?.total_rows??rows.length} ranked medalist${(j.pagination?.total_rows??rows.length)===1?'':'s'}`;$('rBody').innerHTML=rows.length?rows.map(r=>`<tr data-ranking-player="${esc(key(r.name))}" class="${podiumQuery&&key(r.name)===key(podiumQuery)?'is-highlighted':''}"><td class="center">${esc(r.rank)}</td><td><button class="player" data-player="${esc(r.name)}">${esc(r.name)}</button></td><td class="num medal-count-cell medal-gold">${esc(r.gold)}</td><td class="num medal-count-cell medal-silver">${esc(r.silver)}</td><td class="num medal-count-cell medal-bronze">${esc(r.bronze)}</td><td class="num">${esc(r.podiums)}</td><td class="num">${esc(r.tournamentCount)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No medalist matches the current filters.</td></tr>';$('rBody').querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.player));pager($('rPager'),j.pagination||{},p=>{rPage=p;loadRanking()});sortMarkers('r',rSort);requestAnimationFrame(()=>document.querySelector('tr.is-highlighted')?.scrollIntoView({block:'center',behavior:'smooth'}));setError('');resize()}catch(e){setError(e.message);$('rBody').innerHTML='<tr><td colspan="7" class="empty">Podium ranking unavailable.</td></tr>'}}
function medalHTML(t,m){const values=Array.isArray(t.podium?.[m])?t.podium[m]:[];return values.length?values.map(v=>{const n=typeof v==='string'?v:(v?.username||v?.name||'');return `<button class="player ${m}" data-player="${esc(n)}">${esc(n)}</button>`}).join(''):'<span class="sub">—</span>'}
async function loadTournaments(){try{tournamentsLoaded=true;$('tBody').innerHTML='<tr><td colspan="7" class="empty">Loading tournaments…</td></tr>';const j=await get('tournaments',{page:String(tPage),page_size:String(PAGE),search:$('search').value.trim(),year:$('year').value==='all'?'':$('year').value,type:$('type').value,player:playerQuery,sort:tSort.key,direction:tSort.dir});if(!summaryLoaded)applySummary(j);const rows=j.rows||[];$('tCount').textContent=`${j.pagination?.total_rows??rows.length} tournament${(j.pagination?.total_rows??rows.length)===1?'':'s'}${playerQuery?` involving ${playerQuery}`:''}`;$('tBody').innerHTML=rows.length?rows.map(t=>`<tr><td><a class="name" href="${esc(t.webUrl||t.url||'#')}" target="_blank" rel="noopener">${esc(t.name||t.title||t.slug||'Tournament')}</a><span class="sub">${esc(t.playerCount||0)} players</span></td><td>${esc(typeText(t.type))}</td><td>${esc(t.period||t.periodSort||'—')}</td><td><span class="chip ${statusClass(t.status)}">${esc(statusText(t.status))}</span></td><td>${medalHTML(t,'gold')}</td><td>${medalHTML(t,'silver')}</td><td>${medalHTML(t,'bronze')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No tournament matches the current filters.</td></tr>';$('tBody').querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.player));pager($('tPager'),j.pagination||{},p=>{tPage=p;loadTournaments()});sortMarkers('t',tSort);setError('');resize()}catch(e){setError(e.message);$('tBody').innerHTML='<tr><td colspan="7" class="empty">Tournament list unavailable.</td></tr>'}}
function positionModal(){const back=$('modal');if(!embedded||back.hidden)return;try{const frame=window.frameElement,rect=frame?.getBoundingClientRect();if(!rect)return;const vh=window.parent.innerHeight||document.documentElement.clientHeight,top=Math.max(0,-rect.top);back.style.position='absolute';back.style.inset='auto 0 auto 0';back.style.top=`${top}px`;back.style.height=`${Math.max(240,vh)}px`;back.style.padding='14px 20px';back.querySelector('.modal').style.maxHeight=`${Math.max(200,vh-28)}px`}catch(_){}}
async function openPlayer(name){if(window.parent!==window){window.parent.postMessage({type:'p2k-open-player-profile',username:name},window.location.origin);return;}$('modalTitle').textContent=name;$('modalSummary').textContent='Loading medal history…';$('modalBody').innerHTML='<tr><td colspan="3" class="empty">Loading…</td></tr>';$('modal').hidden=false;positionModal();resize();try{const j=await get('player',{username:name});const r=j.player||{};$('modalSummary').textContent=`🥇 ${r.gold||0} · 🥈 ${r.silver||0} · 🥉 ${r.bronze||0}`;const rows=r.tournaments||[];$('modalBody').innerHTML=rows.length?rows.map(t=>`<tr><td><a class="name" href="${esc(t.webUrl||'#')}" target="_blank" rel="noopener">${esc(t.name||'Tournament')}</a></td><td>${esc(t.period||'—')}</td><td><span class="medal ${esc(t.medal)}">${t.medal==='gold'?'🥇':t.medal==='silver'?'🥈':'🥉'} ${esc(t.medal)}</span></td></tr>`).join(''):'<tr><td colspan="3" class="empty">No medal recorded.</td></tr>'}catch(e){$('modalSummary').textContent='Tournament history unavailable';$('modalBody').innerHTML=`<tr><td colspan="3" class="empty">${esc(e.message)}</td></tr>`}resize()}
function selectPanel(panel){active=panel;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===panel));$('panel-tournaments').hidden=panel!=='tournaments';$('panel-ranking').hidden=panel!=='ranking';if(panel==='tournaments'&&!tournamentsLoaded)loadTournaments();resize()}
function debounceReload(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{rPage=tPage=1;loadRanking();if(tournamentsLoaded)loadTournaments()},220)}
async function load(){if(playerQuery){$('playerFilter').hidden=false;$('playerFilter').textContent=`Showing tournaments recorded for ${playerQuery}. Clear the member search from the Hall of Fame to return to all tournaments.`}const summaryP=get('summary').then(applySummary).catch(e=>setError(e.message));selectPanel(active);if(active==='ranking')await loadRanking();else await loadTournaments();await summaryP;resize()}
$('search').oninput=debounceReload;$('year').onchange=$('type').onchange=()=>{tPage=1;if(active==='tournaments')loadTournaments()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectPanel(b.dataset.panel));document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{const obj=b.dataset.table==='t'?tSort:rSort;obj.dir=obj.key===b.dataset.key&&obj.dir==='asc'?'desc':'asc';obj.key=b.dataset.key;if(b.dataset.table==='t'){tPage=1;loadTournaments()}else{rPage=1;loadRanking()}});$('close').onclick=()=>{$('modal').hidden=true;$('modal').removeAttribute('style');$('modal').querySelector('.modal').removeAttribute('style');resize()};$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};new ResizeObserver(resize).observe(document.body);try{if(embedded){window.parent.addEventListener('scroll',positionModal,{passive:true});window.parent.addEventListener('resize',positionModal,{passive:true})}}catch(_){}load();window.P2K_ACSR?.register('hall-tournaments',{refresh:async()=>{summaryLoaded=false;await load();return{converged:true}},convergedIntervalMs:120000,staleAfterMs:120000});
})();
</script></body></html>
